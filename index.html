<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0e9f8e"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Santé &amp; Cité"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Santé &amp; Cité</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#e6f2ef;--card:#ffffff;--soft:#f4f9f8;--line:#d3e6e2;--ink:#13303a;--mut:#4b6b73;--teal:#0e9f8e;--tealD:#0b7f72;--tealL:#d9f5ef;
 --coral:#ff7a59;--coralD:#c4462a;--coralL:#ffe3da;--yel:#ffc94a;--yelL:#fff1cc;--sky:#5bb8f5;--skyL:#dcefff;--vio:#ae8dff;--vioL:#ece4ff;--mint:#3ee6b0;
 --ok:#0e9f8e;--okL:#d9f5ef;--ko:#e0533a;--koL:#ffe3da;--navy:#13303a;--onNavy:#ffffff;--display:Fredoka,Nunito,system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f2229;--card:#173540;--soft:#12303a;--line:#24505c;--ink:#e9f6f4;--mut:#9cbcc2;--tealD:#55d6cf;--tealL:#123f3f;--coralL:#4a2a22;--yelL:#4a3d17;--skyL:#173a52;--vioL:#2f2850;--okL:#123f3f;--koL:#4a2422;--navy:#0a1a20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f2229;--card:#173540;--soft:#12303a;--line:#24505c;--ink:#e9f6f4;--mut:#9cbcc2;--tealD:#55d6cf;--tealL:#123f3f;--coralL:#4a2a22;--yelL:#4a3d17;--skyL:#173a52;--vioL:#2f2850;--okL:#123f3f;--koL:#4a2422;--navy:#0a1a20;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.2}
.app{max-width:560px;margin:0 auto;padding:16px 16px 96px;min-height:100vh}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--tealD)}
.mut{color:var(--mut)}.small{font-size:13px}
.card{background:var(--card);border-radius:20px;padding:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:48px;padding:0 18px;border-radius:16px;border:0;background:var(--navy);color:var(--onNavy);font-family:var(--display);font-weight:600;font-size:16px}
.btn.small{min-height:42px;font-size:15px;padding:0 14px}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.teal{background:var(--teal);color:#fff}.btn.coral{background:var(--coral);color:#2a0f08}
.btn:disabled{opacity:.45;cursor:default}
.back{background:none;border:0;padding:6px 0;font-weight:800;color:var(--tealD);min-height:40px}
/* barre du bas */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px}
.nav button{background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:800;color:var(--mut);position:relative}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--tealD)}
.nav .badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--coral);color:#2a0f08;border-radius:999px;font-size:10.5px;padding:0 6px;min-width:18px;line-height:18px}
/* accueil */
.me{display:flex;gap:12px;align-items:center}
.me .who{flex:1;min-width:0}
.me h1{font-size:26px}
.xpbar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--mint));border-radius:6px}
.flame{display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-weight:700;font-size:18px;color:var(--coralD)}
.flame small{font-family:Nunito;font-size:10.5px;font-weight:800;color:var(--mut)}
.due{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:20px;padding:14px;border:0;width:100%;text-align:left}
.due b{font-family:var(--display);font-size:18px;font-weight:600;display:block}.due span{font-size:13px;color:#c7dde0}
.due .go{margin-left:auto;background:var(--yel);color:#4a3300;border-radius:12px;padding:8px 12px;font-weight:800;white-space:nowrap}
.quests{display:flex;flex-direction:column;gap:8px}
.quest{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:16px;padding:10px 12px}
.quest .qi{width:34px;height:34px;border-radius:10px;background:var(--yelL);display:grid;place-items:center;font-weight:800;color:#8a6200;flex:none}
.quest.done .qi{background:var(--okL);color:var(--tealD)}
.quest .qt{flex:1;font-weight:700;font-size:14px}.quest .qt small{display:block;font-weight:600;color:var(--mut);font-size:12px}
.qbar{height:6px;border-radius:4px;background:var(--line);margin-top:4px;overflow:hidden}.qbar i{display:block;height:100%;background:var(--yel)}
.claim{min-height:36px;padding:0 10px;border-radius:10px;border:0;background:var(--yel);color:#4a3300;font-weight:800;font-size:13px}
.qz{display:grid;gap:12px}
.qzc{position:relative;border:0;border-radius:24px;overflow:hidden;text-align:left;padding:0;background:var(--card);display:flex;flex-direction:column}
.qzc svg{display:block;width:100%;height:auto}
.qzc .t{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.qzc .t b{font-family:var(--display);font-size:20px;font-weight:600}
.pill{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--tealL);color:var(--tealD)}
.pill.coral{background:var(--coralL);color:var(--coralD)}.pill.grey{background:var(--soft);color:var(--mut)}
.qzc.lock{opacity:.75}
/* quartier */
.secs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{border:0;border-radius:20px;padding:14px;text-align:left;min-height:130px;display:flex;flex-direction:column;gap:4px;color:#13303a}
.sec b{font-family:var(--display);font-size:17px;font-weight:600;line-height:1.15}
.sec small{font-weight:700;font-size:12px;opacity:.85}
.sec .bl{margin-top:auto;display:flex;gap:4px}.sec .bl i{width:14px;height:18px;border-radius:3px;background:rgba(255,255,255,.55)}.sec .bl i.on{background:#13303a}
.sec.wide{grid-column:span 2;min-height:90px}
.memline{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--mut)}
.memline .mb{flex:1;height:8px;border-radius:5px;background:var(--line);overflow:hidden}.memline .mb i{display:block;height:100%;background:var(--teal)}
/* secteur : liste des cours */
.clist{display:flex;flex-direction:column;gap:10px}
.crow{display:flex;gap:12px;align-items:center;background:var(--card);border:0;border-radius:18px;padding:12px;text-align:left;width:100%}
.crow .n{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;background:var(--soft);color:var(--mut);flex:none}
.crow .tx{flex:1;min-width:0}.crow .tx b{display:block;font-size:15px}.crow .tx small{color:var(--mut);font-size:12.5px}
.stars{color:var(--yel);font-size:14px;letter-spacing:1px;white-space:nowrap}.stars .off{color:var(--line)}
.crow.soon{background:var(--soft);color:var(--mut)}
/* cours */
.hero{border-radius:24px;overflow:hidden;background:var(--card)}
.hero .top{padding:16px;background:var(--tealL)}
.hero h1{font-size:24px}
.cast{display:flex;gap:10px;padding:12px 16px;overflow-x:auto}
.cast .p{display:flex;flex-direction:column;align-items:center;gap:3px;width:84px;flex:none;text-align:center;font-size:11.5px;font-weight:700;line-height:1.2}
.lvls{display:flex;flex-direction:column;gap:10px}
.lvl{display:flex;gap:12px;align-items:center;background:var(--card);border:0;border-radius:18px;padding:12px;text-align:left;width:100%}
.lvl .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;flex:none;background:var(--tealL);color:var(--tealD)}
.lvl.lock{opacity:.6}.lvl.lock .ic{background:var(--soft);color:var(--mut)}
.lvl.mis .ic{background:var(--coralL);color:var(--coralD)}
.lvl .tx{flex:1;min-width:0}.lvl .tx b{display:block}.lvl .tx small{color:var(--mut);font-size:12.5px;display:block}
.stbar{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--line);margin-top:6px}.stbar i{display:block;height:100%}
.st0{background:var(--line)}.st1{background:var(--yel)}.st2{background:var(--sky)}.st3{background:var(--teal)}
.conseil{background:var(--navy);color:#fff;border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.conseil .lb{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--yel)}
.conseil p{margin:4px 0 0;font-size:14px;line-height:1.45}
/* personnages */
.team{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tm{background:var(--card);border:0;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:5px;text-align:left}
.tm b{font-size:14px;line-height:1.2}.tm small{font-size:11.5px;color:var(--mut)}.tm em{font-style:normal;font-size:11px;font-weight:800;color:var(--tealD)}
.tm.unk{background:var(--soft);color:var(--mut)}
.tm .q{width:52px;height:52px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px}
/* jeu */
.gtop{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0 10px;display:flex;flex-direction:column;gap:8px}
.gtop .r1{display:flex;align-items:center;gap:10px}
.gtop .r1 h2{flex:1;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{font-family:var(--display);font-weight:700;color:var(--tealD);white-space:nowrap}
#gProg{display:flex;gap:3px}#gProg i{flex:1;height:7px;border-radius:4px;background:var(--line)}#gProg i.cur{background:var(--sky)}#gProg i.ok{background:var(--teal)}#gProg i.ko{background:var(--coral)}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gauge{font-size:11px;font-weight:800;color:var(--mut)}.gauge .gb{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:3px}.gauge .gb i{display:block;height:100%;transition:width .5s}
.gauge .d{font-weight:800;margin-left:4px}.gauge .d.p{color:var(--tealD)}.gauge .d.m{color:var(--coralD)}
.qcard{background:var(--card);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.qcard h3{font-size:19px}
.where{font-size:12px;font-weight:800;color:var(--mut)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--mut)}
.tierb.t1{background:var(--skyL)!important;color:#1d5f8f!important}.tierb.t2{background:var(--yelL)!important;color:#8a6200!important}.tierb.t3{background:var(--coralL)!important;color:var(--coralD)!important}
:root[data-theme="dark"] .tierb.t1,:root[data-theme="dark"] .tierb.t2{color:var(--ink)!important}
.stb.s1{background:var(--yelL)!important}.stb.s2{background:var(--skyL)!important}.stb.s3{background:var(--okL)!important;color:var(--tealD)!important}
.ctx{background:var(--soft);border-left:4px solid var(--sky);border-radius:10px;padding:10px 12px;font-size:14px}
.spk{display:flex;gap:10px;align-items:flex-start}
.spk .bub{background:var(--soft);border-radius:4px 16px 16px 16px;padding:10px 12px;flex:1}
.spk .bub small{display:block;font-size:11.5px;font-weight:800;color:var(--tealD);margin-bottom:2px}
.spk .bub h3{font-size:17px;font-family:Nunito;font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;min-height:50px;padding:10px 14px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-weight:700}
.opt.sel{border-color:var(--sky);background:var(--skyL)}
.opt.ok{border-color:var(--ok);background:var(--okL)}.opt.ko{border-color:var(--ko);background:var(--koL)}
.opt .rx{display:block;font-weight:600;font-size:13px;margin-top:4px;color:var(--mut)}
.lbl{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.calc{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
#cin{flex:1;min-width:140px;min-height:50px;border-radius:14px;border:2px solid var(--line);padding:0 14px;font-size:17px;background:var(--card);color:var(--ink)}
#cin.ok,.blank.ok{border-color:var(--ok);background:var(--okL)}#cin.ko,.blank.ko{border-color:var(--ko);background:var(--koL)}
.u{font-weight:800;color:var(--mut)}
.cloze{font-size:16px;line-height:2.3;margin:0}
.blank{width:118px;min-height:36px;border-radius:10px;border:2px solid var(--line);padding:0 8px;font-size:15px;background:var(--card);color:var(--ink);vertical-align:middle}
.fix{display:inline-block;font-size:12.5px;font-weight:800;color:var(--tealD);background:var(--okL);border-radius:8px;padding:0 6px;margin-left:4px;line-height:1.6}
.big{font-family:var(--display);font-size:20px;font-weight:600;text-align:center;background:var(--soft);border-radius:16px;padding:16px}
.big-sub{text-align:center;color:var(--mut);font-size:13px}
.bins{display:grid;gap:8px}
.bin{min-height:72px;border-radius:16px;border:2px dashed var(--line);background:var(--card);padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.bin b{font-size:14px}.bin small{font-size:11.5px;color:var(--mut)}
.bin.sel{border-style:solid;border-color:var(--sky);background:var(--skyL)}.bin.ok{border-style:solid;border-color:var(--ok);background:var(--okL)}.bin.ko{border-style:solid;border-color:var(--ko);background:var(--koL)}
.hint{margin:0;font-size:13px;color:var(--mut)}
.assoc{display:grid;grid-template-columns:1fr 1fr;gap:8px}.assoc .col{display:flex;flex-direction:column;gap:8px}
.as{min-height:48px;padding:8px 10px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:13.5px;text-align:left;position:relative}
.as.sel{border-color:var(--sky);background:var(--skyL)}.as.done{border-color:var(--ok);background:var(--okL)}
.tagn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;margin-right:6px}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.seq,.pool,.slots{display:flex;flex-direction:column;gap:6px}
.pool{flex-direction:row;flex-wrap:wrap}
.slot,.slot2{min-height:44px;border-radius:12px;border:2px dashed var(--line);background:var(--soft);padding:8px 10px;display:flex;gap:8px;align-items:center;text-align:left;font-weight:700;font-size:14px;color:var(--mut)}
.slot b,.slot2 b{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px;flex:none;color:var(--ink)}
.slot.fill,.slot2.fill{border-style:solid;background:var(--card);color:var(--ink)}
.slot2.act{border-color:var(--sky)}
.slot.ok,.slot2.ok{border-color:var(--ok);background:var(--okL)}.slot.ko,.slot2.ko{border-color:var(--ko);background:var(--koL)}
.chipb{min-height:42px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:13.5px;text-align:left}
.segs{margin:0;font-size:16px;line-height:1.9}
.seg{border:0;background:var(--soft);border-radius:8px;padding:3px 6px;font-size:15.5px;text-align:left;margin:2px 0}
.seg.sel{background:var(--skyL);outline:2px solid var(--sky)}.seg.ko-mark{background:var(--koL);outline:2px solid var(--ko)}
textarea{width:100%;border-radius:14px;border:2px solid var(--line);padding:10px 12px;font:inherit;background:var(--card);color:var(--ink);resize:vertical}
.modelbox{background:var(--soft);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}.modelbox p{margin:0}.modelbox ul{margin:0;padding-left:18px}
.conf{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.confb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cb{min-height:48px;border-radius:14px;border:0;font-weight:800;font-size:14px}
.c-s{background:var(--teal);color:#fff}.c-h{background:var(--yel);color:#4a3300}.c-g{background:var(--line);color:var(--ink)}
.cb:disabled{opacity:.4;cursor:default}
.idk{background:none;border:0;color:var(--mut);font-weight:800;text-decoration:underline;min-height:40px;align-self:center}
.fb{border-radius:16px;padding:12px 14px;background:var(--okL);display:flex;flex-direction:column;gap:6px;font-size:14px}
.fb.ko{background:var(--koL)}.fb strong{font-size:15px}.fb .ref{font-size:11.5px;color:var(--mut);font-weight:700}
.memfb{display:flex;flex-direction:column;gap:2px;font-size:12.5px}.memfb .up{color:var(--tealD);font-weight:800}.memfb .down{color:var(--coralD);font-weight:800}
.typed{font-size:13px;color:var(--mut)}
.end{align-items:center;text-align:center}
.stars-big{font-size:38px;color:var(--yel);letter-spacing:4px}.stars-big .off{color:var(--line)}
.endbody{width:100%}
.sectab{display:flex;flex-direction:column;gap:4px;text-align:left;margin-top:8px}
.secrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;background:var(--soft);border-radius:10px;padding:6px 10px}.secrow b.g{color:var(--tealD)}.secrow b.r{color:var(--coralD)}
.databox{background:var(--soft);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.drow{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:12.5px;font-weight:700}
.drow .db{height:12px;border-radius:6px;background:var(--line);overflow:hidden}.drow .db i{display:block;height:100%;background:var(--coral)}
.pop{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.pop,.shake{animation:none}}
/* cerveau */
.memrow{display:grid;grid-template-columns:minmax(0,1fr) 90px 44px;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.memrow.strong{font-weight:800}
.membar{position:relative;height:10px;border-radius:6px;background:var(--line)}.membar i{display:block;height:100%;border-radius:6px;background:var(--teal)}.membar em{position:absolute;top:-3px;width:3px;height:16px;background:var(--coral);border-radius:2px}
.memrow small{grid-column:1/-1;color:var(--mut);font-size:11.5px;margin-top:-4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border-radius:16px;padding:10px;text-align:center}.kpi b{display:block;font-family:var(--display);font-size:24px;font-weight:600;color:var(--tealD)}.kpi small{font-size:11.5px;color:var(--mut);font-weight:700}

 mission:{id:"sp1m",t:"L'observatoire des Hauts-de-France",items:[
  CH("moreau","Bienvenue à l'observatoire. 48 % des décès avant 75 ans chez les hommes sont évitables, et l'obésité atteint 22,1 % chez nous contre 14,2 % en Île-de-France. Comment lis-tu ces écarts ?",[
    ["Ce sont surtout de mauvais choix individuels",0,[-5,-10,0],"Attention : culpabiliser les habitants, c'est oublier les contraintes qu'ils subissent."],
    ["Ils viennent des déterminants sociaux et du territoire : revenus, éducation, offre alimentaire",2,[5,10,0],"Exactement. Le gradient social et l'environnement pèsent autant que les choix individuels."],
    ["C'est une question de génétique régionale",0,[-5,-5,0],"La génétique est un facteur, mais elle n'explique pas des écarts aussi liés au territoire et au milieu social."]],
   "Fiches 3, 8 et 9 : déterminants, gradient social, disparités territoriales.",{t:"Obésité de la population (ORS)",rows:[["Hauts-de-France",22.1],["Île-de-France",14.2]]}),
  BY("mehdi",S("Sur ma carte, certains quartiers de Lille sont saturés de fast-foods. Comment appelle-t-on ce type de zone ?",["food swamp","foodswamp","un food swamp","marais alimentaire"],"À ne pas confondre avec le désert alimentaire, surtout rural.")),
  CH("mehdi","À Vervins, dans l'Aisne, des personnes âgées n'ont plus de commerce à moins de 15 km. Que proposes-tu ?",[
    ["Leur envoyer un dépliant sur les repères du PNNS",0,[0,-5,-2],"Elles connaissent peut-être les repères… le problème, c'est l'accès aux aliments."],
    ["Des livraisons solidaires avec l'épicier local, une association d'insertion et le transport à la demande",2,[10,8,-6],"C'est ce qui a été fait : 150 personnes âgées moins isolées, et l'économie locale soutenue."],
    ["Leur conseiller de se faire aider par leur famille",1,[2,-3,0],"Ça peut aider, mais beaucoup sont isolées : il faut une solution collective."]],
   "Fiche 9 : désert alimentaire, mobilité, livraisons solidaires."),
  BY("moreau",A("Pour l'obésité infantile, aide-moi à placer chaque facteur dans les cercles de Dahlgren et Whitehead.",[["Prédisposition génétique","Cercle 1 · individu"],["Habitudes familiales","Cercle 2 · modes de vie"],["Influence des pairs","Cercle 3 · réseaux sociaux"],["Restauration scolaire","Cercle 4 · conditions de vie"],["Taxe sur les produits sucrés","Cercle 5 · politiques"]],"Une action efficace agit sur plusieurs cercles à la fois.")),
  CH("dumont","On lance une action nutrition dans le bassin minier. Comment s'y prendre sans stigmatiser les habitants ?",[
    ["Cibler uniquement les quartiers les plus touchés",0,[4,-15,-2],"Les familles se sentent pointées du doigt : la confiance chute."],
    ["La même campagne pour tout le monde",1,[3,2,-4],"Personne n'est stigmatisé, mais les écarts ne se réduisent pas."],
    ["Une action pour tous, renforcée là où les besoins sont plus grands",2,[12,8,-5],"C'est l'universalisme proportionné : offre ouverte à tous, intensité adaptée."]],
   "Fiche 10 : universalisme proportionné."),
  CH("moreau","Comment faire participer les habitants du bassin minier ?",[
    ["Organiser des conférences d'experts à la mairie",0,[0,-5,-3],"Information descendante : peu de participation."],
    ["Groupes de parole, ateliers de cuisine collaborative et pairs-aidants issus du quartier",2,[8,12,-4],"Comme à Roubaix : lien social, légitimité, messages adaptés."],
    ["Distribuer des paniers de légumes sans accompagnement",1,[4,2,-8],"Utile, mais sans co-construction, l'appropriation reste faible."]],
   "Fiche 10 : approche communautaire."),
  CH("dumont","Dans un an, comment saura-t-on si l'action a réduit les inégalités ?",[
    ["En comptant les dépliants distribués",0,[0,-3,0],"C'est un indicateur de processus : il ne dit rien de l'impact."],
    ["En comparant la moyenne régionale avant et après",1,[2,0,0],"La moyenne peut s'améliorer sans que les écarts se réduisent."],
    ["En suivant les écarts par quartier et catégorie sociale, avec des données qualitatives",2,[6,6,-2],"C'est l'évaluation différentielle, avec une analyse géolocalisée."]],
   "Fiche 10 : évaluer l'impact sur les inégalités."),
  BY("dumont",W("Rédige pour l'ARS, en quelques phrases : pourquoi faut-il une approche populationnelle de la nutrition ici ?","Les comportements alimentaires sont façonnés par l'environnement, le territoire et la position sociale (gradient social, déserts alimentaires, food swamps). Les consultations individuelles ne suffisent pas : il faut agir collectivement sur les déterminants, avec l'universalisme proportionné et la participation des habitants, en mesurant l'évolution des écarts.",["Déterminants sociaux et territoriaux","Limites de l'approche individuelle","Universalisme proportionné, participation","Mesure des écarts"]))
 ]}
};

    W("Des personnes parfaitement informées gardent des habitudes défavorables pendant des années. Explique.","Les choix intègrent la perception des risques, l'anticipation des conséquences, les priorités et les contraintes, souvent de façon automatique et inconsciente. Les routines et habitudes maintiennent les choix malgré le savoir ; et l'intention dépend aussi des attitudes, des normes perçues et du contrôle perçu.",["Choix automatiques et inconscients","Routines et habitudes","Attitudes, normes, contrôle perçu"])),

    F("Leaders d'opinion : {Katz} et {Lazarsfeld}, {1955}.","")),

    A("Relie chaque résistance à la réponse adaptée.",[["Réactance psychologique","Approche collaborative, proposer des choix"],["Dissonance cognitive","Explorer sans confronter"],["Coûts perçus","Objectifs progressifs"]],""),
    W("Pourquoi ne faut-il pas combattre les résistances de front ?","Ce sont des mécanismes normaux de protection (besoin d'autonomie, cohérence avec ses pratiques, coût de l'effort). Les combattre les renforce ; il faut les comprendre et adopter une approche collaborative, d'autant que 40 % des Français se disent perdus face aux conseils contradictoires.",["Mécanismes normaux de protection","Combattre = renforcer","Comprendre, collaborer"])),

 ]},
 {id:"sp4c",t:"Le changement",s:"Fiches 7 à 10 · motivation, modèles, freins et leviers",items:[

    W("Qu'est-ce que l'internalisation, et pourquoi est-ce la clé ?","C'est transformer des contraintes extérieures en choix personnels, cohérents avec l'identité de la personne. La motivation intrinsèque (plaisir, valeurs, bien-être) est plus durable que l'extrinsèque (récompenses, peur, pression).",["Contraintes → choix personnels","Cohérence avec l'identité","Intrinsèque = durable"])),

    E(["Le patient n'a aucune intention de changer :"," je lui donne un plan alimentaire détaillé"," pour la semaine."],1,"En précontemplation, inutile de donner un plan : il faut sensibiliser.","Piège d'examen.")),
  N(Q("Une rechute, dans le modèle de Prochaska, c'est…",["Normal : une occasion d'apprendre et d'ajuster","Un échec qui oblige à tout recommencer","La preuve que la personne n'est pas motivée"],"Le changement est long et non linéaire."),

  N(Q("À quoi le contrôle perçu d'Ajzen est-il proche ?",["Au sentiment d'auto-efficacité","À la norme injonctive","À la réactance"],"Lien avec la fiche 1.")),

    A("Relie chaque situation à un réflexe.",[["Analyser les déterminants","Cognitif, émotionnel, social, culturel, auto-efficacité"],["Intégrer les normes sociales","Valoriser les normes favorables"],["Soutenir la motivation","Autonomie, compétence, proximité"],["Gérer les résistances","Approche collaborative, choix et options"],["S'adapter aux cultures","Respecter l'identité, éviter l'exclusion"]],""))
 ]}

 mission:{id:"sp4m",t:"Le panel lyonnais",items:[
  CH("smoreau","Une famille du panel achète des plats préparés alors qu'elle connaît leurs effets. L'équipe veut lancer une action. Par quoi commences-tu ?",[
    ["Une conférence sur la composition des plats préparés",0,[0,-6,-3],"Ils savent déjà : le savoir ne suffit pas."],
    ["Analyser leurs déterminants : habitudes, émotions, contraintes de temps et de budget, auto-efficacité",2,[6,10,-2],"Comprendre avant de conseiller : c'est la base de tout le cours."],
    ["Leur donner un menu-type à suivre",1,[2,-3,-1],"Concret, mais sans tenir compte de leurs contraintes réelles."]],
   "Fiches 1 et 10."),
  BY("bertrand",A("Pour cette mère qui doute d'elle, quels leviers d'auto-efficacité ?",[["Maîtrise progressive","Une recette en 15 minutes la 1re semaine"],["Expérience vicariante","Témoignage d'une maman du quartier"],["Persuasion verbale","Encouragements crédibles"],["Régulation émotionnelle","Gérer le stress du soir"]],"Fiche 1.")),
  CH("lefevre","Chez les adolescents du panel, beaucoup croient que « tout le monde mange au fast-food après les cours ». Quel message ?",[
    ["« Le fast-food, c'est mauvais pour la santé. »",0,[0,-6,0],"Message injonctif : réactance probable chez les ados."],
    ["Montrer la norme réelle : la majorité des élèves du lycée rentrent goûter chez eux",2,[6,8,-1],"Valoriser une norme descriptive positive corrige la fausse perception."],
    ["Interdire la sortie à midi",0,[1,-12,0],"Contraindre renforce les résistances."]],
   "Fiche 5."),
  CH("lefevre","Dans un groupe de seniors ruraux, on veut promouvoir les légumineuses. Qui associer ?",[
    ["Mme Roche, respectée de tous pour sa cuisine",2,[5,10,0],"Une leader d'opinion : son adhésion facilite l'appropriation et le relais."],
    ["Personne : un dépliant suffit",0,[0,-5,-1],"L'information seule passe mal."],
    ["Un influenceur national",1,[1,0,-5],"Peu crédible pour ce public : la source doit être proche."]],
   "Fiche 6 : Katz et Lazarsfeld."),
  BY("smoreau",T(B_RES,"« Encore une diététicienne qui va me dire quoi manger ! »",0,"Réponse : approche collaborative, proposer des choix.")),
  CH("bertrand","M. Karim dit : « Je sais que je devrais manger moins salé, mais pour l'instant ce n'est pas le moment. » Quelle stratégie ?",[
    ["Lui remettre un plan hyposodé détaillé",0,[0,-8,0],"Trop tôt : il n'est pas en préparation."],
    ["Explorer son ambivalence : ce qu'il gagnerait, ce qui le retient",2,[5,10,0],"Il est en contemplation : on explore l'ambivalence."],
    ["Attendre qu'il revienne de lui-même",1,[0,0,0],"Respectueux, mais on peut l'accompagner dès maintenant."]],
   "Fiche 8 : Prochaska."),
  CH("bertrand","Une famille d'origine sénégalaise participe à l'atelier. Le thieboudienne du dimanche est très riche. Que proposes-tu ?",[
    ["Le supprimer du menu",0,[0,-14,0],"Menace identitaire : résistance et abandon."],
    ["Garder le plat et ses fonctions sociales, en adaptant (plus de légumes, moins d'huile)",2,[6,10,0],"Adapter, pas supprimer : on respecte le rituel."],
    ["Le remplacer par du poisson vapeur",0,[2,-8,-1],"Inacceptable culturellement."]],
   "Fiche 3."),
  BY("smoreau",W("Rédige pour le conseil scientifique, en quelques phrases : comment accompagner durablement un changement alimentaire ?","Le savoir ne suffit pas : il faut analyser les déterminants individuels (cognition, émotions, auto-efficacité), sociaux (normes, pairs) et culturels. On adapte la stratégie à l'étape de Prochaska, on nourrit la motivation intrinsèque (autonomie, compétence, proximité), on gère les résistances par une approche collaborative et on vise le maintien par l'automatisation, en normalisant les rechutes.",["Savoir ≠ faire, déterminants","Étape du changement","Motivation intrinsèque","Résistances, maintien"]))
 ]}
};

 conseil:{who:"morvan",t:"Toujours : méthodes mixtes, respect des choix, sans jugement. Diagnostic rapide : données secondaires + sondages courts, 6 à 8 entretiens ciblés, observations aux heures clés, indicateurs simples. Pour les ados : formats courts, autonomie et plaisir, pairs relais. Végans : B12, fer, calcium, oméga-3 dès le 1er bilan. Applis : éducation et plaisir, pas que le comptage."},

 ]},

 ]}

 mission:{id:"sp5m",t:"Le diagnostic du quartier mixte",items:[
  CH("delorme","La ville de Tours nous demande un diagnostic rapide des pratiques d'un quartier mixte. Quelle méthode ?",[
    ["Un grand questionnaire en ligne, et c'est tout",0,[1,-4,-3],"Déclaratif seul : biais de désirabilité sociale, et les publics éloignés ne répondent pas."],
    ["Données secondaires + sondages courts, 6 à 8 entretiens ciblés, observations au marché et à la cantine",2,[8,6,-5],"Méthodes mixtes : c'est la triangulation."],
    ["Uniquement des capteurs connectés chez 50 familles",1,[3,-2,-10],"Riche, mais cher et sans le sens que donnent les entretiens."]],
   "Fiches 8 et 9.",{t:"Fruits et légumes chaque jour (INCA3)",rows:[["Cadres",50],["Ouvriers et employés",28]]}),
  BY("morvan",T(B_BIAIS,"Les familles déclarent 5 portions de légumes par jour ; l'observation en montre 2",1,"Surévaluation des aliments valorisés.")),
  CH("santini","Les ados du quartier passent beaucoup de temps sur TikTok et grignotent. Quel message construire ?",[
    ["Une affiche « Les snacks font grossir »",0,[0,-8,-2],"Injonctif et culpabilisant : rejeté."],
    ["Des vidéos courtes avec des pairs relais formés : snacks maison rapides, plaisir et autonomie",2,[6,10,-4],"On reprend les codes des réseaux, sans interdire."],
    ["Demander aux parents de confisquer les téléphones",0,[0,-10,0],"Conflit garanti, sans effet sur les pratiques."]],
   "Fiches 1, 5 et 9."),
  CH("morvan","Une mère célibataire achète beaucoup de plats préparés. Comment l'aborder en entretien ?",[
    ["Lui expliquer que c'est mauvais pour ses enfants",0,[0,-12,0],"Elle se sent jugée : tu perds l'information et sa confiance."],
    ["Climat de confiance, questions ouvertes non directives, valoriser ce qu'elle réussit déjà",2,[5,10,0],"Tu découvres ses contraintes (temps, budget) et ses ressources."],
    ["Lui faire remplir un carnet alimentaire de 7 jours",1,[2,-2,-1],"Utile, mais lourd pour elle, et biaisé sans entretien."]],
   "Fiches 3 et 8."),
  BY("delorme",C("Repas préparés : 45 % chez les familles monoparentales contre 28 % chez les couples bi-actifs. Quel est l'écart, en points ?",17,"45 − 28 = 17 points.","points")),
  CH("santini","Un retraité isolé cuisine de moins en moins. La mairie propose un dépliant. Ton avis ?",[
    ["Le dépliant suffit",0,[0,-4,-1],"Le problème est l'isolement, pas l'information."],
    ["Portage de repas et repas partagés au foyer-logement, textures et saveurs adaptées",2,[8,8,-6],"On agit sur l'isolement et la commensalité."],
    ["Lui conseiller des compléments nutritionnels",1,[3,0,-3],"Peut-être utile un jour, mais il faut d'abord évaluer et rompre l'isolement."]],
   "Fiches 1 et 6."),
  CH("morvan","Une jeune du quartier est végane et ne prend aucun supplément.",[
    ["Lui dire de remanger des produits animaux",0,[0,-12,0],"Position dogmatique : elle ne reviendra pas."],
    ["Respecter son choix, faire le point sur B12, fer, calcium, oméga-3, orienter vers le médecin pour un bilan",2,[8,8,-1],"Sans jugement, avec un vrai suivi des risques."]],
   "Fiches 4 et 9."),
  BY("delorme",W("Rédige la conclusion du diagnostic pour les élus.","Les pratiques varient selon l'âge, le milieu, le territoire et la configuration familiale ; les écarts sociaux persistent (contraintes de budget, de temps, de géographie). Le diagnostic croise données secondaires, enquêtes, entretiens et observations, car le déclaratif seul est biaisé. Il faut partir des pratiques réelles et proposer des actions structurelles et adaptées à chaque groupe, sans jugement.",["Pratiques selon les groupes","Inégalités et contraintes","Triangulation des méthodes","Actions adaptées et structurelles"]))
 ]}
};

 {id:"sp6a",t:"Comprendre",s:"Fiches 1 et 2 · définition, niveaux, littératie nutritionnelle",items:[
  "Fiche 0 · Le constat",
  N(C("Quel pourcentage des adultes ont des difficultés importantes à comprendre l'information de santé en France ?",11,"Beaucoup plus chez les plus de 75 ans.","%"),
    null,
    W("Pourquoi la littératie est-elle une responsabilité professionnelle du diététicien ?","Un conseil non compris ne peut pas être appliqué : la faible littératie réduit l'efficacité des interventions et creuse les inégalités sociales de santé. Repérer les publics vulnérables et adapter ses messages garantit l'équité d'accès à l'information nutritionnelle.",["Non compris = non appliqué","Inégalités sociales de santé","Repérer, adapter, équité"])),
  "Fiche 1 · Définition et 3 niveaux",
  N(Q("La littératie en santé, c'est…",["La capacité d'obtenir, traiter et comprendre l'information de santé pour prendre des décisions éclairées","Savoir lire et écrire","Connaître le vocabulaire médical"],"D'après l'OMS."),
    F("Littératie en santé : {obtenir}, traiter et {comprendre} l'information pour prendre des {décisions|decisions} éclairées.",""),
    E(["Ce patient lit couramment le journal :"," il a donc forcément"," une bonne littératie en santé."],1,"Littératie ≠ alphabétisation : on peut savoir lire sans comprendre ce qu'implique une glycémie.","Piège d'examen.")),
  N([T(B_DIM,"Comprendre et mémoriser un conseil",0,""),T(B_DIM,"Échanger avec le soignant",1,""),T(B_DIM,"Évaluer la fiabilité d'une information",2,"")],
    S("Cite les 3 dimensions de la littératie en santé (une suffit).",["cognitive","sociale","critique"],"Cognitive, sociale, critique.")),
  N(Q("Par honte de ne pas comprendre, un patient peut…",["Développer des stratégies d'évitement","Poser plus de questions","Changer de médecin systématiquement"],"La littératie pèse sur la relation.")),
  N(O("Classe les 3 niveaux de littératie, du plus simple au plus avancé.",["Fonctionnelle","Interactive","Critique"],""),
    [T(B_LIT,"Lit une étiquette et calcule une portion simple",0,""),T(B_LIT,"Pose des questions et échange avec d'autres patients",1,""),T(B_LIT,"Repère un conflit d'intérêts dans un article",2,"")],
    A("Relie chaque niveau à ton adaptation pédagogique.",[["Fonctionnelle","Informations factuelles"],["Interactive","Échanges interactifs"],["Critique","Discussions nuancées"]],"Identifier le niveau permet d'adapter ta pédagogie.")),
  "Fiche 2 · Littératie nutritionnelle et déterminants",
  N(A("Les compétences de la littératie nutritionnelle : relie.",[["Étiquetage","Tableaux nutritionnels, % d'apports, ingrédients"],["Calculs","Grammes en équivalences visuelles"],["Numérique","Applis, infos fiables en ligne"],["Application","Traduire les conseils en achats et en repas"]],""),
    S("Quelle est la compétence la plus difficile de la littératie nutritionnelle ?",["analyse critique","l'analyse critique","esprit critique","analyse critique d'informations contradictoires"],"Super-aliments, régimes miracles, dangers alimentaires."),
    W("Pourquoi lire une étiquette est-il plus complexe qu'il n'y paraît ?","Il faut à la fois lire (vocabulaire technique), calculer (pourcentages, portions) et analyser (comparer, hiérarchiser) : trois compétences en même temps, et les compétences en maths sont souvent surestimées.",["Lire + calculer + analyser","En même temps","Maths surestimées"])),
  N(Q("Comment évaluer les compétences cognitives d'un patient ?",["Observer sa lecture, le faire reformuler, proposer des calculs simples, vérifier la mémorisation d'une séance à l'autre","Lui faire passer un test de QI","Lui demander son diplôme"],""),
    S("Cite une compétence cognitive mobilisée par la littératie.",["lecture","calcul","memorisation","mémorisation","synthese","synthèse","prise de decision","prise de décision"],"")),
  N(Q("Certaines cultures valorisent la corpulence comme signe de santé. Conséquence ?",["Une résistance involontaire aux conseils de perte de poids","Aucune","Un refus de consulter"],"Autre exemple : le riz blanc jugé plus « pur »."),
    null,

    W("« Adapter, ce n'est pas simplifier à l'excès. » Explique.","Adapter, c'est rendre le conseil applicable par cette personne-là : vérifier la compréhension, ajuster le rythme, répéter sous différentes formes, s'appuyer sur l'entourage, sans infantiliser ni appauvrir le message.",["Applicable par cette personne","Rythme, répétition, entourage","Sans infantiliser"])),

    A("Relie chaque situation au réflexe.",[["Identifier une faible littératie","Observer hésitations et évitements"],["Adapter les messages","Pyramide inversée, mots simples"],["Concevoir des supports","Tester avec le public cible"],["Accompagner","Teach-back, rythme adapté"],["Barrières culturelles","Médiateurs, codes non verbaux"]],""))
 ]}

 mission:{id:"sp6m",t:"La maison de santé accessible",items:[
  CH("garnier","Mme Petit, 78 ans, diabétique, revient pour la 3e fois avec la même glycémie. Elle « oublie » toujours ses lunettes et fait lire sa fille. Ton analyse ?",[
    ["Elle manque de motivation",0,[0,-8,0],"Non : non-observance inexpliquée et évitement de l'écrit sont des signaux de faible littératie."],
    ["Signaux d'une faible littératie : je vérifie sa compréhension sans la mettre en difficulté",2,[6,10,0],"Repérer sans stigmatiser."],
    ["Elle a besoin de nouvelles lunettes",1,[1,0,0],"Possible, mais ce n'est pas l'essentiel : c'est un évitement classique."]],
   "Fiche 3."),
  BY("garnier",A("Adapte les mots de la fiche de Mme Petit.",[["Lipides","Graisses"],["Glucides","Sucres"],["Apport calorique","Énergie des aliments"]],"Fiche 5.")),
  CH("garnier","Comment vérifier ce que Mme Petit a retenu ?",[
    ["« Avez-vous bien compris ? »",0,[0,-3,0],"Elle répondra « oui » par politesse."],
    ["« Racontez-moi ce que vous allez manger demain matin. »",2,[6,8,0],"Teach-back : elle réexplique avec ses mots."],
    ["Lui faire relire la fiche à voix haute",0,[0,-10,0],"Tu risques de l'humilier."]],
   "Fiche 7."),
  CH("lucas","Je prépare une affiche pour la salle d'attente. Laquelle ?",[
    ["Un tableau des apports en grammes de chaque nutriment",0,[0,-4,-2],"Illisible pour beaucoup."],
    ["Photos de vrais aliments, assiette ½ légumes, ¼ protéines, ¼ féculents, feux tricolores, phrases courtes",2,[6,6,-3],"Visuels réels et pictogrammes universels."],
    ["Un long texte bien expliqué",1,[1,0,-1],"Juste, mais la pyramide inversée et les visuels manquent."]],
   "Fiche 6."),
  CH("lucas","L'affiche est prête. On l'imprime en 500 exemplaires ?",[
    ["Oui, elle est validée par l'équipe",0,[0,-3,-8],"Les experts ne voient pas les obstacles du public."],
    ["D'abord la tester avec des patients, l'ajuster, puis comparer avec l'ancienne",2,[4,6,-2],"Test → ajustements itératifs → comparaison."]],
   "Fiche 6."),
  CH("diallo","Plusieurs familles comoriennes viennent peu et posent peu de questions. Comment faire ?",[
    ["Leur envoyer un courrier de convocation",0,[0,-8,-1],"Barrière de l'écrit et de la langue : peu d'effet."],
    ["M'associer comme médiatrice, adapter le vocabulaire et les supports, respecter les codes non verbaux",2,[8,12,-3],"Légitimité et messages dans les codes du groupe."],
    ["Faire traduire la brochure actuelle mot à mot",1,[3,2,-3],"Utile, mais sans tenir compte des représentations culturelles."]],
   "Fiches 4, 7 et 8."),
  BY("diallo",T(B_BAR,"Une maman s'inquiète de son loyer et retient peu de la consultation",2,"Les conditions de vie précaires saturent l'attention.")),
  BY("garnier",W("Présente à l'équipe ta stratégie pour une maison de santé accessible à tous.","Repérer la faible littératie (signaux, populations à risque) sans stigmatiser ; lever les barrières (vocabulaire, jargon, chiffres, stress) ; communiquer clairement (phrases courtes, pyramide inversée, visuels réels testés avec le public) ; vérifier par le teach-back, adapter le rythme et mobiliser l'entourage et les médiateurs.",["Repérer sans stigmatiser","Lever les barrières","Communication claire, supports testés","Teach-back, entourage, médiateurs"]))
 ]}
};

 {id:"sp7a",t:"Je cible",s:"Fiches 1 à 3 · modèle, message, segmentation",items:[

    S("Cite un moyen de construire sa légitimité d'émetteur.",["transparence sur ses sources","transparence","reconnaitre l'incertitude","reconnaître l'incertitude","coherence","cohérence","coherence entre messages et pratique"],"Transparence sur ses sources, reconnaître l'incertitude, cohérence."),

 mission:{id:"sp7m",t:"La campagne fruits et légumes",items:[
  CH("rousseau","L'ARS veut une campagne fruits et légumes. Quel message central ?",[
    ["« Mangez plus de fruits et légumes, c'est bon pour la santé ! »",0,[1,-3,-2],"Vague, non actionnable, sans bénéfice personnel."],
    ["« Une portion de légumes à chaque repas : plus d'énergie au quotidien »",2,[8,6,-2],"Unique, clair, actionnable, avec un bénéfice personnel."],
    ["Les 10 repères du PNNS sur une même affiche",0,[0,-5,-3],"Message dilué : on ne retient rien."]],
   "Fiche 2."),
  CH("rousseau","Le budget permet trois déclinaisons. Comment segmenter ?",[
    ["Une seule version pour tous",0,[1,-4,1],"Les leviers diffèrent selon les publics."],
    ["Jeunes urbains (réseaux, praticité), familles populaires (économie, goût des enfants), seniors ruraux (tradition, circuits courts)",2,[8,8,-4],"Segmentation et leviers adaptés."],
    ["Trois versions selon le sexe des destinataires",1,[2,-2,-4],"Critère trop pauvre : comportements et stades de changement sont plus prédictifs."]],
   "Fiche 3."),
  BY("yanis",A("Je décline la campagne : quel format pour quel réseau ?",[["Instagram","Stories éphémères"],["TikTok","Vidéos courtes"],["LinkedIn","Infographies pour les pros"]],"Fiche 5.")),
  CH("yanis","Mon affiche pour les abribus contient un tableau des apports et 4 paragraphes. Ça te va ?",[
    ["Oui, c'est complet",0,[0,-4,-3],"Personne ne lit un tableau en passant : règle des 3-5 secondes."],
    ["Titre percutant, une image, le message principal, la source en petit : compris en 3-5 secondes",2,[6,4,-2],"Hiérarchie visuelle et règle des 3-5 secondes."]],
   "Fiche 4."),
  CH("rousseau","Un fabricant de jus de fruits propose de financer la campagne en échange de son logo.",[
    ["On accepte, ça double le budget",0,[-2,-14,10],"Conflit d'intérêts : la crédibilité de tout le message s'effondre."],
    ["On refuse et on cherche des relais neutres : médecins, pharmaciens, associations",2,[4,10,-3],"Neutralité perçue et alliances locales."],
    ["On accepte sans afficher le logo",0,[0,-10,8],"Financement caché : pire encore pour la transparence."]],
   "Fiches 1 et 6."),
  CH("fontaine","Avant d'imprimer 20 000 affiches, que fait-on ?",[
    ["On imprime, on verra bien",0,[0,-3,-8],"Une incompréhension découverte après coup coûte cher."],
    ["Un pré-test sur un échantillon représentatif, puis un test A/B des deux visuels",2,[5,5,-2],"On repère les incompréhensions et on garde la version la plus performante."]],
   "Fiche 9."),
  BY("fontaine",T(B_IND,"Après 2 mois, 40 % des personnes interrogées citent le slogan sans aide",1,"Rappel spontané : compréhension et mémorisation.")),
  CH("fontaine","La campagne a fait 2 millions de vues. Peut-on dire qu'elle a réussi ?",[
    ["Oui, 2 millions de vues, c'est énorme",0,[0,-4,0],"Diffusion n'est pas compréhension, ni changement."],
    ["Pas encore : compréhension (rappel), puis comportements (panels d'achats) avec un groupe témoin",2,[6,6,-3],"L'évaluation ultime porte sur les comportements, puis la santé."],
    ["Il faut regarder le taux d'engagement",1,[2,0,0],"Utile, mais ça reste de la diffusion."]],
   "Fiches 7 et 8."),
  BY("rousseau",W("Rédige pour la directrice de l'ARS la synthèse de ta stratégie de campagne.","Un émetteur crédible et neutre, appuyé sur des relais locaux ; un message unique et actionnable avec un bénéfice personnel ; des publics segmentés avec des leviers et des canaux adaptés (réseaux, affichage 3-5 s, proximité) ; le respect du cadre (PNNS, règlement 1924/2006, droit à l'image) ; des pré-tests et tests A/B ; une évaluation de la diffusion, de la compréhension et des comportements.",["Émetteur crédible, neutre","Message actionnable","Segmentation, canaux","Cadre légal et éthique","Tester et mesurer"]))
 ]}
};

 mission:{id:"sp8m",t:"Le Contrat local de santé",items:[
  CH("marchand","Premier comité du Contrat local de santé alimentation. Par quoi commences-tu ?",[
    ["Présenter mon plan d'action nutritionnel déjà rédigé",0,[1,-10,0],"Les partenaires se sentent mis devant le fait accompli."],
    ["Cartographier les acteurs (missions, contraintes, financements, publics, modalités) et lancer un diagnostic partagé",2,[6,10,-2],"Chacun apporte son expertise, habitants compris."],
    ["Demander à chacun ce qu'il fait déjà, sans méthode",1,[2,3,0],"Bon réflexe, mais sans grille, on oublie des éléments."]],
   "Fiches 5 et 7."),

  CH("haddad","Je voudrais le détail du suivi nutritionnel de cette famille pour mon rapport.",[

  CH("lemaire","Une adolescente de 15 ans a beaucoup maigri et s'inquiète sans cesse de son poids. Sa mère te l'adresse.",[

    ["Je repère les signaux, j'oriente vers le médecin et un centre spécialisé, je reste en lien pour le volet préventif",2,[8,8,-1],"Repérer, orienter, coordonner."]],

  CH("marchand","L'infirmière du centre de santé estime que les ateliers nutrition sont « son » domaine. La tension monte.",[

    ["On clarifie les missions, on part de l'intérêt commun et on propose une co-animation, documentée",2,[6,10,0],"Intérêts communs, compromis qui préservent les missions."],
    ["Je la laisse faire pour éviter le conflit",1,[-2,2,0],"Le conflit s'apaise, mais ton expertise se dilue."]],
   "Fiches 9 et 10."),
  BY("marchand",A("Je prépare le dossier de financement : relie chaque source à sa caractéristique.",[["ARS","Priorités politiques centrales"],["FEDER","Fonds européen, montants importants"],["Fondation privée","Flexible, mais indépendance à surveiller"],["Budget participatif","Priorités citoyennes"]],"Fiche 7.")),
  BY("marchand",W("En fin d'année, l'élu te demande ce qui fait la réussite du Contrat local de santé. Réponds.","Une posture bientraitante et non-jugeante avec les habitants ; un réseau cartographié avec des instances distinctes (pilotage, coordination) et des outils partagés (fiches de liaison, tableau de bord) ; le secret partagé respecté ; un langage commun entre professions et des rôles clarifiés ; des conflits résolus par l'intérêt commun ; une évaluation collaborative avec des indicateurs consensuels.",["Posture bientraitante","Coordination et outils","Secret partagé","Rôles clarifiés, conflits gérés","Évaluation partagée"]))
 ]}

COURS.sp9={id:"sp9",n:9,t:"Outils pédagogiques",lieu:"Atelier de conception de l'IREPS · Rennes",
 pitch:"Créer un outil d'éducation nutritionnelle, ce n'est pas que vulgariser : il faut une méthode, de l'analyse des besoins à la validation sur le terrain. À l'IREPS, Manon, Théo et Josiane conçoivent un kit « équilibre à petit budget » pour les centres sociaux.",
 P:{legoff:{n:"Manon Le Goff",r:"Chargée de projet IREPS, pédagogie",av:{bg:"#ffc94a",skin:"#f0c8a8",hair:"#c26a2e",hs:"long",shirt:"#13303a",glasses:1}},
    theo:{n:"Théo Kerjean",r:"Designer graphique",av:{bg:"#ae8dff",skin:"#e8b896",hair:"#2b1b14",hs:"curly",shirt:"#3ee6b0"}},

 conseil:{who:"legoff",t:"Toujours : simple, testé, validé, suivi. Faible littératie : une idée par support, pictogrammes, gros texte, test en réel, sans infantiliser. Petit budget : réplicable, modulaire, partenariats, prototypes low-cost. Validation : experts externes, sources datées, pas de biais commercial, traçabilité. Co-construire avec des prototypes tangibles ; indicateurs définis avant diffusion."},
 levels:[
 {id:"sp9a",t:"J'explore",s:"Fiches 1 à 3 · ludique, visuel, numérique, besoins spécifiques",items:[
  "Fiche 0 · Le fil rouge",
  N(O("Remets dans l'ordre la démarche de création d'un outil.",["Analyse des besoins","Choix","Conception","Test","Diffusion"],""),
    Q("Que doit concilier un bon outil pédagogique ?",["Rigueur scientifique et accessibilité pédagogique","Esthétique et coût","Rapidité et quantité"],"Il conditionne l'efficacité de tes interventions et ta crédibilité.")),
  "Fiche 1 · Outils ludiques, manipulables, ateliers",
  N(Q("Un jeu éducatif utilise…",["Des mécaniques ludiques (règles, objectifs, récompenses) pour faciliter l'apprentissage","Uniquement des quiz","Des récompenses financières"],"Engagement spontané, mémorisation durable, moins de résistances."),
    F("Un jeu éducatif repose sur des {règles|regles}, des {objectifs} et des {récompenses|recompenses}.",""),
    W("Pourquoi les jeux sont-ils efficaces en éducation nutritionnelle ?","Ils suscitent un engagement spontané et une mémorisation durable, réduisent les résistances aux messages préventifs, rendent accessibles des notions complexes, et la motivation intrinsèque pousse à rejouer : répétition sans lassitude.",["Engagement, mémorisation","Moins de résistances","Rejouer = répéter sans lassitude"])),
  N(A("Relie chaque support manipulable à son intérêt.",[["Jeux de plateau","Explorer les choix et leurs conséquences"],["Cartes éducatives","Mémoriser par association visuelle"],["Puzzles des groupes d'aliments","Apprendre à classer"]],""),
    S("Comment appelle-t-on l'apprentissage par la manipulation ?",["kinesthesique","kinesthésique","apprentissage kinesthesique","apprentissage kinesthésique"],"Approche constructiviste."),
    O("Remets dans l'ordre la méthode pour concevoir un support manipulable.",["Fixer un objectif précis","Choisir la métaphore ou les règles","Tester la manipulation avec le public","Simplifier jusqu'à une prise en main intuitive"],"")),
  N(Q("Le « learning by doing », c'est…",["Apprendre en faisant : gestes et techniques transférables au quotidien","Apprendre par cœur","Regarder une démonstration"],"Cuisine, jardinage pédagogique, dégustation."),
    null,
    CAS("Un groupe pense que les légumineuses « c'est fade et long à cuisiner ».",Q("Quel outil choisir ?",["Un atelier dégustation de légumineuses bien préparées","Une affiche sur les protéines végétales","Un quiz"],"La découverte gustative casse les préjugés mieux qu'un discours."))),
  "Fiche 2 · Supports visuels, multimédias, numériques",
  N(Q("Quel est le risque d'une infographie trop simplifiée ?",["Des données déformées qui induisent de mauvais comportements","Elle coûte trop cher","Elle est trop longue à lire"],"Équilibre entre simplification et précision."),
    S("Cite une représentation schématique qui aide à mémoriser l'équilibre.",["pyramide alimentaire","pyramide","cercle de l'equilibre","cercles de l'équilibre","assiette"],"")),

  N([T(B_OUT,"Puzzle des groupes d'aliments",0,""),T(B_OUT,"Vidéo de démonstration culinaire",1,""),T(B_OUT,"Quiz adaptatif en ligne",2,""),T(B_OUT,"Jeu de cartes des nutriments",0,""),T(B_OUT,"Journal alimentaire numérique",2,"")],
    S("Quelle limite majeure des outils numériques ?",["fracture numerique","fracture numérique","exclusion numerique"],"Piège d'examen : le numérique n'est pas universel."),
    E(["Pour toucher tous les publics du centre social,"," je remplace tous les supports papier par une application,"," plus moderne."],1,"Le numérique exclut les personnes en fracture numérique : il ne remplace pas tout.","")),
  "Fiche 3 · Besoins spécifiques",
  N(Q("Pour des personnes avec troubles cognitifs, on prévoit…",["Gros caractères, contrastes, manipulation simplifiée, stimulation sensorielle, séquences courtes","Un support pour enfants","Des textes plus longs et détaillés"],"Adapter n'est pas infantiliser."),
    null,
    W("« Adapter n'est pas infantiliser. » Explique pour un public âgé avec troubles cognitifs.","On adapte la forme (gros caractères, contrastes, manipulation simple, textures et odeurs, séquences courtes contre la fatigue cognitive) tout en respectant la dignité et l'intelligence des participants : ni ton enfantin, ni contenu appauvri.",["Adaptations de forme","Séquences courtes","Respect de la dignité"])),
  N(Q("Adapter un outil à une culture, c'est…",["Changer les modalités d'application, pas les principes scientifiques","Changer la science selon la culture","Traduire mot à mot"],"Sans relativisme nutritionnel."),
    S("Comment appelle-t-on l'abandon des principes scientifiques au nom de la culture ?",["relativisme nutritionnel","relativisme"],""),
    E(["Pour respecter la culture du groupe,"," j'enlève du support les repères scientifiques"," qui ne correspondent pas à leurs habitudes."],1,"Seules les modalités s'adaptent ; les principes scientifiques restent universels.","Piège d'examen.")),
  N(A("Précarité : relie chaque exigence à sa raison.",[["Coût réduit","Accessibilité économique"],["Robustesse","Durer dans des conditions difficiles"],["Conseils petit budget","Réalistes, sans culpabiliser"],["Valoriser les compétences","Plutôt que souligner les manques"]],""))
 ]},
 {id:"sp9b",t:"J'adapte",s:"Fiches 4 à 7 · public, Bloom, contraintes, grille qualité",items:[
  "Fiche 4 · Analyser le public et le terrain",

  N(Q("Pour un public à littératie limitée…",["Une idée par support, progression linéaire, répétitions stratégiques, visuels compensatoires","Beaucoup de texte pour tout expliquer","Un support différent pour stigmatiser moins"],"Les visuels aident ceux qui lisent mal et enrichissent pour tous."),

  "Fiche 6 · Contraintes techniques et organisationnelles",

    S("Cite une façon de rendre un outil évolutif.",["contenus modulaires","modulaire","supports numeriques","date de validite","date de validité","version datée","mises a jour"],"Contenus modulaires, numérique actualisable, date de validité.")),

  N(A("Relie chaque dimension à un critère.",[["Contenu","Validation scientifique, pas de conflit d'intérêts"],["Accessibilité","Adaptation culturelle et linguistique"],["Utilisation","Utilisable en tout ou en partie"],["Implication","Collective et individuelle"],["Apprentissages","Construction de savoirs, ancrage"]],""),
    null,
    W("À quoi sert la grille de qualité ?","Elle sert à choisir un outil existant comme à vérifier le sien avant diffusion, sur 5 dimensions : contenu, accessibilité, utilisation, implication, apprentissages.",["Choisir un outil existant","Vérifier le sien","5 dimensions"]))
 ]},
 {id:"sp9c",t:"Je conçois",s:"Fiches 8 à 10 · co-construction, tests, diffusion",items:[

 ]}

/* --- normalisation des réponses tapées --- */
var SUB={"₀":"0","₁":"1","₂":"2","₃":"3","₄":"4","₅":"5","₆":"6","₇":"7","₈":"8","₉":"9","⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁺":"+","⁻":"-"};
function norm(s){s=String(s).toLowerCase().replace(/[₀-₉⁰¹²³⁴-⁹⁺⁻]/g,function(c){return SUB[c]||c}).replace(/œ/g,"oe").replace(/æ/g,"ae").replace(/[’`]/g,"'");
  s=s.normalize("NFD").replace(/[̀-ͯ]/g,"");
  s=s.replace(/^\s*(le|la|les|un|une|des|du|de la)\s+/,"").replace(/^\s*(l|d)'\s*/,"");
  return s.replace(/[^a-z0-9+]/g,"");}
function lev(a,b){if(a===b)return 0;var m=a.length,n=b.length,d=[];for(var i=0;i<=m;i++){d[i]=[i]}for(var j=1;j<=n;j++)d[0][j]=j;
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}

  return list.some(function(a){var y=norm(a);if(x===y)return true;if(/\d/.test(y))return false;var tol=y.length>=9?2:y.length>=5?1:0;return tol&&lev(x,y)<=tol;});}

var TIERN={1:"Reconnaître",2:"Rappeler",3:"Appliquer"};
var KIND={qcm:"QCM",calc:"Calcul",tri:"Tri",assoc:"Association",ordre:"Remise en ordre",saisie:"Réponse libre",trous:"Texte à trous",pourquoi:"Explique pourquoi",erreur:"Trouve l'erreur",schema:"Schéma à légender"};

      '<div class="opts">'+opts.map(function(x,j){return '<button class="opt" type="button" data-j="'+j+'">'+esc(x.o[0])+'</button>'}).join("")+'</div><div id="fb"></div></div>';

  var code="SPC1:"+btoa(unescape(encodeURIComponent(JSON.stringify(S))));$("#bk").value=code;
  $("#bkCopy").onclick=function(){var t=$("#bk");t.select();try{navigator.clipboard.writeText(t.value).then(function(){toast("Code copié.")},function(){document.execCommand("copy");toast("Code copié.")})}catch(e){try{document.execCommand("copy");toast("Code copié.")}catch(e2){}}};
  $("#bkLoad").onclick=function(){var v=$("#bkIn").value.trim();if(v.indexOf("SPC1:")!==0){toast("Ce code ne vient pas de ce jeu.");return;}
    var p=null;try{p=JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));}catch(e){}
    if(p&&typeof p==="object"){S=merge(S,p);S.carnet=(S.carnet||[]).filter(function(c){return c&&c.key&&NOTIONS[c.key]});save();$("#bkIn").value="";toast("Progressions fusionnées : rien n'a été perdu.");show("home");}else toast("Code illisible.");};
}


/* =============== SYNCHRONISATION SUPABASE =============== */
var GAME_ID="sante-cite",SB=null,SBuser=null,SBlast=null,SBerr="",pushT=null,SBstep=0,SBmail="";
var CFG=window.SUPA||{};
var SB_ON=!!(CFG.url&&CFG.key&&window.supabase&&window.supabase.createClient);
function merge(a,b){/* a = local, b = distant : on garde le meilleur des deux */
  var newer=(b.ts||0)>(a.ts||0)?b:a,o=Object.assign(blank(),newer);
  o.xp=Math.max(a.xp||0,b.xp||0);
  o.stars={};[a.stars||{},b.stars||{}].forEach(function(s){Object.keys(s).forEach(function(k){o.stars[k]=Math.max(o.stars[k]||0,s[k])})});
  o.team=Object.assign({},a.team||{},b.team||{});
  o.mem={};[a.mem||{},b.mem||{}].forEach(function(m){Object.keys(m).forEach(function(k){if(!o.mem[k]||(m[k].last||0)>(o.mem[k].last||0))o.mem[k]=m[k]})});
  o.days={};[a.days||{},b.days||{}].forEach(function(d){Object.keys(d).forEach(function(k){o.days[k]=Math.max(o.days[k]||0,d[k])})});
  o.ts=Math.max(a.ts||0,b.ts||0);return o;}
function schedulePush(){if(!SB_ON||!SBuser)return;clearTimeout(pushT);pushT=setTimeout(push,2500)}
function push(){if(!SBuser)return Promise.resolve();
  return SB.from("progress").upsert({user_id:SBuser.id,game:GAME_ID,data:S,updated_at:new Date().toISOString()}).then(function(r){
    if(r.error){SBerr=r.error.message;}else{SBerr="";SBlast=new Date();}refreshSync();});}
function pull(){if(!SBuser)return Promise.resolve();
  return SB.from("progress").select("data").eq("game",GAME_ID).maybeSingle().then(function(r){
    if(r.error){SBerr=r.error.message;refreshSync();return;}
    if(r.data&&r.data.data){S=merge(S,r.data.data);S.carnet=(S.carnet||[]).filter(function(c){return c&&c.key&&NOTIONS[c.key]});try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
    return push().then(function(){var vis=screens.filter(function(s){return !$("#"+s).hidden})[0];if(vis&&vis!=="game")show(vis);});});}
function syncNow(){return pull()}
if(SB_ON){
  SB=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  SB.auth.getSession().then(function(r){SBuser=r.data&&r.data.session?r.data.session.user:null;if(SBuser)pull();refreshSync();});
  SB.auth.onAuthStateChange(function(ev,sess){var was=SBuser;SBuser=sess?sess.user:null;if(SBuser&&!was)pull();refreshSync();});
  document.addEventListener("visibilitychange",function(){if(!SBuser)return;if(document.hidden){clearTimeout(pushT);push();}else pull();});
}
function syncCard(){
  var h='<div class="card" id="syncCard"><div class="lbl" style="margin-bottom:6px">Synchronisation entre appareils</div>';
  if(!SB_ON)return h+'<p class="small mut" style="margin:0">Pas encore activée. Une fois le jeu en ligne, remplis le fichier config.js avec ton adresse Supabase et ta clé publique : un bouton de connexion apparaîtra ici.</p></div>';
  if(SBuser){return h+'<p class="small" style="margin:0 0 8px">Connectée : <b>'+esc(SBuser.email||"")+'</b><br><span class="mut">'+(SBerr?"Erreur : "+esc(SBerr):SBlast?"Dernière synchro à "+SBlast.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"Synchronisation…")+'</span></p><div class="row"><button class="btn small teal" type="button" id="sbNow">Synchroniser maintenant</button><button class="btn small ghost" type="button" id="sbOut">Se déconnecter</button></div></div>';}
  if(SBstep===1)return h+'<p class="small" style="margin:0 0 8px">Un code a été envoyé à <b>'+esc(SBmail)+'</b>. Tape-le ici (regarde aussi les spams).</p><div class="row"><input id="sbCode" inputmode="numeric" autocomplete="one-time-code" placeholder="Code reçu" style="flex:1;min-height:44px;border-radius:12px;border:2px solid var(--line);padding:0 10px;font:inherit;background:var(--card);color:var(--ink)"><button class="btn small" type="button" id="sbVerify">Valider</button></div><button class="idk" type="button" id="sbBack">Changer d\'adresse</button>'+(SBerr?'<p class="small" style="color:var(--coralD);margin:6px 0 0">'+esc(SBerr)+'</p>':'')+'</div>';
  return h+'<p class="small mut" style="margin:0 0 8px">Connecte-toi avec ton e-mail pour retrouver ta progression sur ton téléphone et ton ordinateur. Tu recevras un code à 6 chiffres, sans mot de passe.</p><div class="row"><input id="sbMail" type="email" autocomplete="email" placeholder="ton@email.fr" value="'+esc(SBmail)+'" style="flex:1;min-width:180px;min-height:44px;border-radius:12px;border:2px solid var(--line);padding:0 10px;font:inherit;background:var(--card);color:var(--ink)"><button class="btn small" type="button" id="sbSend">Recevoir un code</button></div>'+(SBerr?'<p class="small" style="color:var(--coralD);margin:6px 0 0">'+esc(SBerr)+'</p>':'')+'</div>';}
function refreshSync(){var c=$("#syncCard");if(!c)return;c.outerHTML=syncCard();wireSync();}
function wireSync(){
  var s=$("#sbSend");if(s){var go=function(){var m=$("#sbMail").value.trim();if(!/.+@.+\..+/.test(m)){SBerr="Adresse e-mail invalide.";refreshSync();return;}SBmail=m;s.disabled=true;
    SB.auth.signInWithOtp({email:m,options:{shouldCreateUser:true}}).then(function(r){if(r.error){SBerr=r.error.message;}else{SBerr="";SBstep=1;}refreshSync();var c=$("#sbCode");if(c)c.focus();});};
    s.onclick=go;$("#sbMail").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();go();}});}
  var v=$("#sbVerify");if(v){var ver=function(){var t=$("#sbCode").value.replace(/\D/g,"");if(t.length<6){SBerr="Le code contient au moins 6 chiffres.";refreshSync();return;}v.disabled=true;
    SB.auth.verifyOtp({email:SBmail,token:t,type:"email"}).then(function(r){if(r.error){SBerr="Code incorrect ou expiré.";}else{SBerr="";SBstep=0;toast("Connectée ! Ta progression est synchronisée.");}refreshSync();});};
    v.onclick=ver;$("#sbCode").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();ver();}});}
  var b=$("#sbBack");if(b)b.onclick=function(){SBstep=0;SBerr="";refreshSync();};
  var n=$("#sbNow");if(n)n.onclick=function(){n.disabled=true;syncNow().then(function(){toast("Synchronisé.")});};
  var o=$("#sbOut");if(o)o.onclick=function(){push().then(function(){return SB.auth.signOut()}).then(function(){SBuser=null;refreshSync();});};
}
/* PWA : fonctionne hors ligne une fois installé */
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});}

/* =============== DÉMARRAGE =============== */
show("home");
})();
