COURS.ds11={id:"ds11",n:"Soin 11",t:"Télésanté : cadre et enjeux",lieu:"Réseau de télésanté nutritionnelle · Cévennes et Lozère",
 pitch:"7,4 millions de Français ont un accès limité à un généraliste, et il n'y a que 15 495 diététiciens en France. Hugo Pradel suit Camille, diabétique dans un village des Cévennes, et Patrice, à 60 km de son cabinet. La télésanté est un levier d'équité… à condition de n'exclure personne.",
 P:{pradel:{n:"Hugo Pradel",r:"Diététicien en télésanté · Mende",av:{bg:"#55d6cf",skin:"#e8b896",hair:"#6b3b1f",hs:"short",shirt:"#13303a"}},
    camille:{n:"Camille Rouvière",r:"Patiente, diabétique, Cévennes",av:{bg:"#ff9476",skin:"#f0c8a8",hair:"#c26a2e",hs:"long",shirt:"#ffc94a"}},
    patrice:{n:"Patrice Allègre",r:"Patient, diabétique de type 2",av:{bg:"#ffc94a",skin:"#c99067",hair:"#8a8a8a",hs:"short",shirt:"#5bb8f5",glasses:1}}},
 conseil:{who:"pradel",t:"Bien choisir, sécuriser, n'exclure personne. 4 modalités : téléconsultation, télé-expertise (avis entre pros), télésurveillance, téléassistance (aider un confrère en direct). Idéale pour les chroniques stables ; le présentiel reste pour l'examen physique, les TCA, la pédiatrie. Et toujours une alternative pour les patients éloignés du numérique."},
 levels:[
 {id:"ds11a",t:"Définir et organiser",s:"Fiches 0 à 2 · constat, 4 modalités, organisation, DMP",items:[
  "Fiche 0 · Le constat",
  N(A("Chiffres de départ : relie.",[["7,4 millions (11,1 %)","Accès limité à un généraliste"],["15 495","Diététiciens en France"],["2018","Financement de l'Assurance Maladie, médecins uniquement"]],""),
    Q("La télésanté est…",["Une modalité complémentaire au présentiel, jamais un substitut universel","Le futur remplaçant des consultations","Réservée aux médecins"],""),
    Q("Quel événement a accéléré le développement de la télésanté ?",["La crise sanitaire","La loi de 2016 sur les GHT","Le RGPD"],"Financée depuis 2018 pour les médecins, elle s'est accélérée pendant la crise sanitaire.")),
  "Fiche 1 · Définition et 4 modalités",
  N(Q("La télésanté, c'est…",["L'ensemble des activités sanitaires, sociales ou médico-sociales à distance grâce aux TIC","La télémédecine des médecins","Une application de santé"],"Plus large que la télémédecine : elle inclut les diététiciens."),
    E(["La télésanté et la télémédecine sont synonymes :"," elles concernent les médecins,"," pas les diététiciens."],1,"La télésanté est plus large et inclut les professionnels non médecins comme les diététiciens.","Piège d'examen.")),
  N([T(B_MOD,"Bilan complet à distance avec Camille",0,""),T(B_MOD,"Le médecin de Camille demande comment adapter son alimentation à un nouveau traitement",1,""),T(B_MOD,"Glycémies et carnet alimentaire reçus chaque jour",2,""),T(B_MOD,"Aider en direct une jeune collègue pendant sa consultation",3,"")],
    E(["Quand j'accompagne en direct une collègue débutante pendant sa consultation,"," je fais de la télé-expertise,"," c'est un avis entre professionnels."],1,"Aider un confrère en temps réel pendant sa consultation, c'est la téléassistance.","Piège d'examen.")),
  N(A("Spécificités de la télésanté nutritionnelle : relie.",[["Mesures","Auto-mesure guidée, photos de portions"],["ETP","Étiquettes en partage d'écran, ateliers culinaires virtuels"],["Suivi","Plus rapproché : diabète, dyslipidémies, TCA"]],""),
    F("Grâce à la téléconsultation, Camille évite {80} km aller-retour chaque mois.","")),
  "Fiche 2 · Organisation et DMP",
  N(A("Pourquoi c'est un enjeu (UFC Que Choisir, 2023) : relie.",[["25,3 millions","Usagers avec une offre libérale insuffisante"],["1/4","Femmes en désert gynécologique"],["28,9 %","Enfants en désert pédiatrique"],["19 %","À plus de 45 min d'un ophtalmologue"]],"")),
  N([T(B_PILIERT,"Plateforme certifiée",0,""),T(B_PILIERT,"Connexion stable en montant et descendant",1,""),T(B_PILIERT,"Logiciel métier connecté, pas de double saisie",2,"")],
    F("Selon ce cours, le débit minimum est de {2} Mbps en montant et descendant.",""),
    E(["Pour la télésanté, le débit minimum"," est toujours de 8 Mbps,"," quel que soit le cours."],1,"Ce cours donne 2 Mbps ; le cours sur la téléconsultation donnait 8 Mbps : réponds selon le cours de la question.","Piège d'examen.")),
  N(O("Remets dans l'ordre les 6 étapes d'une téléconsultation.",["Évaluation préalable","Planification","Préparation","Déroulement","Documentation","Suivi"],""),
    Q("À l'étape de planification, on envoie…",["Un lien sécurisé, un numéro de secours et la liste des documents à préparer","Uniquement la facture","Rien, le patient se connecte seul"],"")),
  N(A("Règles du DMP : relie.",[["Accès","Carte CPS ou e-CPS"],["Contenu","Données strictement nécessaires, si pas d'opposition"],["Contrôle","Accès tracés et visibles par le patient"],["Abus","Accès inapproprié sanctionnable"]],""),
    W("Qu'apporte le DMP à la continuité des soins ?","Il permet de consulter l'historique du patient, d'ajouter ses comptes-rendus et de partager ses recommandations avec les autres professionnels.",["Historique","Comptes-rendus","Recommandations partagées"]))
 ]},
 {id:"ds11b",t:"Pour qui ?",s:"Fiches 3 et 4 · pathologies, territoires, publics",items:[
  "Fiche 3 · Pathologies chroniques",
  N(F("Patrice : HbA1c de {8,2|8.2} % à {7,1|7.1} % en {6} mois de téléconsultations mensuelles.",""),
    Q("Avant la télésanté, Patrice (à 60 km du cabinet) venait…",["Une fois par semestre","Une fois par semaine","Jamais"],"Avec la télésanté : consultations mensuelles + télésurveillance quotidienne.")),
  N(A("Ce que permet la télésanté : relie.",[["Diabète de type 2","Analyser l'autosurveillance glycémique"],["Hypertension","Repérer le sel caché en partage d'écran"],["Dyslipidémies","Analyser les photos de repas"],["Obésité","Séances courtes et fréquentes, 20 min par semaine"]],""),
    Q("Quels patients sont les plus adaptés à la télésanté ?",["Les patients chroniques et stables qui ont besoin d'un suivi régulier","Les patients en première consultation","Les enfants avec un TCA"],"Piège d'examen.")),
  N(A("Éducation enrichie : relie.",[["Groupes","Patients de territoires différents"],["Ateliers culinaires virtuels","Depuis la cuisine du patient, enregistrables"],["Programmes ciblés","Diabète gestationnel, ménopause, adolescents"],["Carnets numériques","Feedback, objectifs, récompenses"]],"")),
  "Fiche 4 · Territoires et publics",
  N(A("Inégalités territoriales : relie.",[["87 %","Du territoire en désert médical"],["6,73","Diététiciens / 100 000 hab. en Creuse"],["25,34","Diététiciens / 100 000 hab. en Haute-Garonne"],["≈ 20 %","Des diététiciens en Île-de-France"]],""),
    E(["Proposer la télésanté aux patients ruraux"," est surtout une démarche commerciale"," pour élargir sa patientèle."],1,"Le cours parle d'une mission de service public d'équité territoriale.","Piège d'examen.")),
  N(A("Publics qui en bénéficient : relie à l'adaptation.",[["Personnes âgées","Questionnaires simplifiés, aidant impliqué"],["Patients chroniques","20 min toutes les 2 semaines plutôt qu'1 h par mois"],["Précarité","Plus de coûts de transport ni de garde d'enfants"]],""),
    O("Bénéfices pour l'accès : remets dans l'ordre.",["Moins de renoncements liés à la distance","Accès pour les personnes à mobilité réduite","Cadre parfois plus rassurant","Continuité en situation exceptionnelle"],""),
    W("Comment la télésanté aide-t-elle la continuité ville-hôpital ?","Elle maintient le suivi pendant une hospitalisation prolongée, facilite la coordination avec l'équipe, prépare le retour à domicile et permet de transmettre ses comptes-rendus instantanément.",["Suivi pendant l'hospitalisation","Coordination","Retour à domicile"]))
 ]},
 {id:"ds11c",t:"Limites et avenir",s:"Fiches 5 à 8 · bénéfices, fracture, perspectives, méthodes",items:[
  "Fiche 5 · Bénéfices et limites",
  N(A("Bénéfices : relie.",[["Organisation","Créneaux flexibles, file active plus grande"],["Observance","Contacts fréquents, ajustements réactifs"],["Satisfaction","Plus de 85 % en suivi chronique stabilisé"]],""),
    E(["Plus de 85 % des patients sont satisfaits :"," la télésanté convient donc"," à toutes les situations."],1,"Ce chiffre concerne le suivi de pathologies chroniques stabilisées, pas toutes les situations.","Piège d'examen.")),
  N(Q("La principale limite de la télésanté est…",["L'impossibilité d'un examen physique complet","Le coût","Le manque de plateformes"],"Pas de plis cutanés, d'évaluation de l'hydratation ni de la fonte musculaire."),
    [T(B_PREF,"Suivi d'un diabétique stable bien équipé",0,""),T(B_PREF,"Première consultation avec bilan anthropométrique",1,""),T(B_PREF,"Recherche de signes de dénutrition",1,""),T(B_PREF,"Adolescente avec un TCA",1,""),T(B_PREF,"Patient sans connexion",1,"")]),
  "Fiche 6 · Fracture numérique et équité",
  N(F("L'illectronisme touche {15,4|15.4} % de la population et {62} % des plus de 75 ans (INSEE 2023).",""),
    Q("Pourquoi parle-t-on de « double peine » pour les zones blanches ?",["Loin des professionnels et sans accès à la télésanté","Deux fois plus de diabétiques","Deux fois plus de sanctions"],""),
    W("Quel est le paradoxe de la télésanté ?","Conçue pour améliorer l'équité d'accès, elle peut exclure les plus vulnérables (âgés, précaires, zones blanches, complexité technique) si on ne prévoit pas d'inclusion numérique.",["Conçue pour l'équité","Peut exclure","Âgés, précaires, zones blanches"])),
  N(O("Solutions d'inclusion : remets dans l'ordre.",["Consultations hybrides et créneaux d'initiation","Partenariats avec médiathèques et centres sociaux","Téléconsultation par simple appel téléphonique","Évaluer les compétences numériques dès la 1re consultation"],""),
    E(["M. Faure préfère venir au cabinet :"," je lui impose la téléconsultation,"," c'est plus efficace."],1,"Le respect du choix du patient est un principe éthique fondamental : on propose sans imposer.","Piège d'examen.")),
  "Fiche 7 · Transformation et perspectives",
  N(O("Remets dans l'ordre les 5 outils d'évaluation à distance.",["Auto-mesure guidée","Photographies standardisées","Questionnaires numériques validés","Calcul en temps réel","Carnets connectés"],""),
    A("Innovations : relie.",[["Intelligence artificielle","Analyse automatique des photos de repas"],["Réalité virtuelle","Supermarché virtuel"],["Applications","Rappels, défis : le diététicien les prescrit"],["Objets connectés","Glucomètres, tensiomètres"]],""),
    E(["L'IA analyse les photos de repas mieux que moi :"," je peux lui confier"," mes recommandations."],1,"L'IA est un outil d'aide à la décision : elle ne remplace pas l'expertise du diététicien.","Piège d'examen.")),
  N(A("Viabilité économique : relie.",[["Économies","Moins de frais de structure et de déplacement"],["Coûts","Investissements et formation à amortir"],["Financements","Mutuelles, entreprises, associations"],["Médico-économique","Moins d'hospitalisations évitables"]],""),
    O("Nouvelles compétences du diététicien : remets dans l'ordre.",["Outils de communication numérique","Évaluation adaptée à la distance","Écoute renforcée","Intégration à l'équipe"],"")),
  "Fiche 8 · Méthodes",
  N(A("Relie chaque situation au réflexe.",[["Préparer","Éligibilité, lien, numéro de secours, créneau tampon"],["Choisir les patients","Stables, suivi régulier"],["Sécuriser","HDS, MSSanté, DMP si nécessaire"],["Inclure","Hybride, médiathèques, téléphone"]],""),
    F("On évalue un programme de télésanté à {6}, {12} et {18} mois.",""),
    S("Quel est le fil commun ? Bien choisir, sécuriser, …",["n exclure personne","n'exclure personne","nexclure personne"],""))
 ]}
 ],
 mission:{id:"ds11m",t:"Le réseau des Cévennes",items:[
  BY("pradel",T(B_MOD,"Le médecin de Camille vous écrit : nouveau traitement, quelle alimentation ?",1,"Avis entre professionnels : télé-expertise.")),
  CH("camille","« Je fais 80 km pour 30 minutes de consultation. Je vais arrêter le suivi. »",[
    ["Je lui propose une téléconsultation mensuelle avec télésurveillance de ses glycémies, après avoir vérifié sa connexion et son aisance",2,[10,12,8],"Levier d'équité, éligibilité vérifiée."],
    ["« C'est dommage, mais c'est votre choix. »",0,[-10,-4,-4],"Renoncement aux soins évitable."]],
   "Fiches 1 et 4."),
  CH("pradel","Patrice demande à commencer directement à distance, pour sa toute première consultation.",[
    ["Première consultation au cabinet pour le bilan anthropométrique, puis téléconsultations mensuelles",2,[10,6,10],"Alternance présentiel-distanciel."],
    ["Pas de souci, tout à distance",1,[-4,4,-6],"Pas d'examen physique pour le bilan initial."]],
   "Fiche 5."),
  CH("pradel","Mme Bonnet, 81 ans, vit en zone blanche et n'a pas d'ordinateur.",[
    ["Suivi hybride : présentiel, appels téléphoniques, et créneau à la médiathèque avec un médiateur si elle le souhaite",2,[8,10,6],"Inclusion, choix de la patiente."],
    ["Elle ne peut pas bénéficier de la télésanté, tant pis",0,[-10,-8,-6],"Double peine."]],
   "Fiche 6."),
  BY("pradel",O("Remets dans l'ordre l'organisation de la téléconsultation de Camille.",["Évaluer son éligibilité","Envoyer lien, numéro de secours, documents","Tester le matériel","Dérouler la séance","Documenter","Planifier le suivi"],"")),
  BY("pradel",W("Après 6 mois, comment évaluer le programme de télésanté du réseau ?","Indicateurs quantitatifs (nombre de patients, HbA1c, hospitalisations évitées) et retours qualitatifs (satisfaction, barrières techniques), puis ajustement à 6, 12 et 18 mois.",["Quantitatif : patients, HbA1c, hospitalisations","Qualitatif : satisfaction, barrières","Ajuster à 6, 12, 18 mois"]))
 ]}
};

/* ---------- SOIN 12 · RISQUES, LIMITES ET RESPONSABILITÉS DANS LE NUMÉRIQUE ---------- */
var B_MENACE=[["Ransomware",""],["Phishing",""],["Logiciel malveillant",""],["Déni de service",""]];
var B_ORIG=[["Erreur humaine",""],["Défaillance technique",""],["Vol ou perte",""],["Accès non autorisé",""]];
var B_NOTIF=[["Registre seulement",""],["Registre + CNIL",""],["Registre + CNIL + patients",""]];
COURS.ds12={id:"ds12",n:"Soin 12",t:"Risques, limites et responsabilités",lieu:"Cabinet libéral de Lisa Morel · Nantes",
 pitch:"La santé est la cible préférée des cybercriminels, libéraux compris : un seul clic sur un lien frauduleux peut tout bloquer. Lisa Morel a sécurisé son cabinet pas à pas ; son confrère Yann Le Goff vient de recevoir un message de rançon. Prévenir, tracer, être prêt.",
 P:{morel:{n:"Lisa Morel",r:"Diététicienne libérale · Nantes",av:{bg:"#ae8dff",skin:"#f0c8a8",hair:"#2b1b14",hs:"bun",shirt:"#55d6cf"}},
    legoff:{n:"Yann Le Goff",r:"Diététicien libéral · Saint-Nazaire",av:{bg:"#5bb8f5",skin:"#e8b896",hair:"#c26a2e",hs:"short",shirt:"#ffc94a"}},
    sarah:{n:"Sarah Benoît",r:"Secrétaire du cabinet",av:{bg:"#ffc94a",skin:"#c99067",hair:"#1f1410",hs:"long",shirt:"#ff7a59",glasses:1}}},
 conseil:{who:"morel",t:"Prévenir, tracer, être prêt. 6 mesures : mises à jour, antivirus pro, pare-feu, chiffrement, gestionnaire de mots de passe, double facteur ; et la règle 3-2-1. Violation : registre toujours, CNIL sous 72 h si risque, patients si risque élevé. Moindre privilège. RCP indispensable, assurance cyber fortement recommandée."},
 levels:[
 {id:"ds12a",t:"Menaces et protection",s:"Fiches 0 à 2 · cybermenaces, approche multicouche",items:[
  "Fiche 0 · Pourquoi la santé ?",
  N(Q("Pourquoi la santé est-elle la cible privilégiée des cybercriminels ?",["Les données de santé valent cher sur le marché noir, les systèmes ont des failles, et l'urgence médicale pousse à céder au chantage","Les soignants sont riches","Les hôpitaux n'ont pas d'informatique"],""),
    W("En quoi la responsabilité du diététicien s'étend-elle avec le numérique ?","Dossiers dématérialisés, téléconsultations, applis multiplient les points d'exposition : un simple clic peut tout compromettre. Le diététicien est désormais responsable de la protection numérique des données qui lui sont confiées.",["Points d'exposition multiples","Un clic suffit","Protection numérique des données"])),
  "Fiche 1 · Les cybermenaces",
  N([T(B_MENACE,"Toutes les données chiffrées, rançon exigée",0,""),T(B_MENACE,"Faux e-mail du logiciel métier, fausse page de connexion",1,""),T(B_MENACE,"Clé USB infectée qui enregistre les frappes",2,""),T(B_MENACE,"Prise de RDV en ligne saturée et inaccessible",3,"")],
    A("Relie chaque menace à sa particularité.",[["Ransomware","La plus redoutable : paralysie"],["Phishing","Plus de 80 % des cyberattaques"],["Logiciel malveillant","Détecté parfois des mois après"],["Déni de service","Réputation abîmée"]],"")),
  N(A("Vulnérabilités propres aux diététiciens : relie.",[["BYOD","Smartphone personnel peu sécurisé"],["Cloud grand public","Google Drive, Dropbox : non HDS"],["Mots de passe","Réutilisés ou trop simples"],["Formation","Limitée en cybersécurité"]],""),
    E(["Je partage mes bilans patients avec ma collègue via Google Drive :"," c'est sécurisé"," grâce au mot de passe."],1,"Google Drive et Dropbox ne sont pas certifiés HDS : y stocker des données patients est interdit.","Piège d'examen."),
    W("Quel est l'impact d'une cyberattaque sur un cabinet ?","Paralysie de l'activité pendant des jours ou des semaines (perte de revenus, patients qui partent), perte irremplaçable de l'historique nutritionnel, et coûts : expertise, équipements, restauration, mise en conformité, pertes d'exploitation.",["Paralysie","Perte de données","Coûts"])),
  "Fiche 2 · L'approche multicouche",
  N(O("Remets dans l'ordre les 6 mesures de sécurisation technique.",["Mises à jour automatiques","Antivirus professionnel","Pare-feu","Chiffrement du disque","Gestionnaire de mots de passe","Double facteur"],""),
    Q("Quelle est la protection la plus efficace contre les attaques automatisées ?",["Les mises à jour, souvent jugées contraignantes","Un fond d'écran sécurisé","Changer d'ordinateur chaque année"],"Piège d'examen."),
    S("Quel est le dernier rempart si tout le reste échoue ?",["chiffrement","le chiffrement","chiffrement des donnees","chiffrement des données"],"")),
  N(F("Règle {3}-{2}-{1} : 3 copies, 2 supports, 1 hors site certifié HDS ; sauvegarde automatisée {quotidienne}.",""),
    E(["Mes sauvegardes tournent toutes seules chaque nuit :"," je suis donc protégée,"," pas besoin de tester."],1,"Une sauvegarde non testée est une fausse sécurité : on teste régulièrement la restauration.","")),
  N(O("Remets dans l'ordre les 4 signaux d'alarme du phishing.",["Expéditeur inhabituel","Urgence artificielle","Demande d'informations confidentielles","Lien ou pièce jointe suspects"],""),
    CAS("Sarah reçoit : « URGENT : votre compte Doctolib sera suspendu dans 1 h. Reconnectez-vous ici. »",Q("Que doit-elle faire ?",["Ne pas cliquer, vérifier par le site officiel, signaler à Lisa","Cliquer vite pour éviter la suspension","Transférer à toute l'équipe"],"Urgence artificielle + lien suspect.")))
 ]},
 {id:"ds12b",t:"Violations et traçabilité",s:"Fiches 3 à 5 · origines, notification, accès",items:[
  "Fiche 3 · Les violations de confidentialité",
  N([T(B_ORIG,"Pièce jointe avec les données d'un autre patient",0,""),T(B_ORIG,"Faille du logiciel métier",1,""),T(B_ORIG,"Smartphone non chiffré oublié dans le train",2,""),T(B_ORIG,"Collaborateur curieux qui consulte un dossier",3,"")],
    E(["Mon erreur d'envoi était involontaire :"," ma responsabilité n'est donc"," pas engagée."],1,"Même involontaire, une violation engage la responsabilité : disciplinaire, civile, voire pénale.","Piège d'examen.")),
  N(A("Violations d'intégrité ou de disponibilité : relie.",[["Intégrité","Modification non autorisée ou accidentelle"],["Disponibilité","Perte, destruction, accès impossible"]],""),
    A("Données exposées : relie au risque.",[["Identification","Usurpation d'identité"],["Santé nutritionnelle","Discrimination par employeurs, assureurs"],["Correspondances","Appréciations cliniques non destinées au patient"]],""),
    CAS("Yann ajoute par erreur un patient dans le groupe de messagerie personnelle qu'il partage avec ses confrères.",W("Qu'en retenir ?","Le patient a reçu des informations sur d'autres patients : violation massive, déclaration à la CNIL et excuses individuelles. L'usage d'outils personnels non sécurisés multiplie les risques d'erreur : il faut une messagerie sécurisée de santé.",["Violation massive","CNIL, excuses","Outils personnels = risque"]))),
  "Fiche 4 · Évaluer et notifier",
  N(A("Évaluer le risque : relie.",[["Nature","Santé, financières, sensibles"],["Volume","Quantité de données, nombre de personnes"],["Identification","Facilité à retrouver les personnes"],["Gravité","Discrimination, usurpation, préjudice financier"]],""),
    [T(B_NOTIF,"Fichier sans données patients supprimé puis restauré, aucun risque",0,""),T(B_NOTIF,"Accès limité à quelques coordonnées, risque modéré",1,""),T(B_NOTIF,"Dossiers de santé de 300 patients volés",2,"")]),
  N(F("Notification à la CNIL : sous {72} heures ; registre des violations : article {33.5|33,5} du RGPD.",""),
    E(["La violation n'est pas notifiée à la CNIL car il n'y a pas de risque :"," je n'ai donc rien à consigner"," dans mon registre."],1,"Le registre est obligatoire pour toutes les violations, même non notifiées.","Piège d'examen."),
    W("Pourquoi une violation abîme-t-elle la relation thérapeutique ?","Préjudice moral (intimité violée, détresse), usurpation d'identité, et perte de confiance : le patient peut arrêter son suivi, moins bien observer ses conseils ou ne plus partager d'informations importantes.",["Préjudice moral","Usurpation","Perte de confiance, arrêt du suivi"])),
  "Fiche 5 · Traçabilité et accès",
  N(O("Remets dans l'ordre les 6 éléments de traçabilité.",["Qui ? l'utilisateur","Quand ? l'horodatage","Quoi ? la nature de l'action","Sur quoi ? les données","Avec quel résultat ?","Depuis où ? IP et poste"],""),
    Q("Les historiques de connexion doivent être…",["Conservés de façon sécurisée, protégés contre la modification et la suppression","Effacés chaque semaine","Accessibles à tous"],"Ils servent de preuve.")),
  N(Q("Le principe du moindre privilège :",["Chacun n'a que les droits strictement nécessaires à sa fonction","Tout le monde a les mêmes droits","Le titulaire n'a aucun droit"],""),
    E(["Notre stagiaire est partie il y a 3 mois :"," on garde son compte actif,"," elle reviendra peut-être."],1,"On supprime tout de suite les comptes inactifs : c'est une vulnérabilité souvent négligée.","Piège d'examen."),
    CAS("Sarah, la secrétaire, peut ouvrir tous les bilans cliniques des patients.",Q("Que corrige Lisa ?",["Elle limite ses droits à l'agenda et aux coordonnées : pas besoin des données cliniques","Rien, c'est pratique","Elle lui retire tout accès"],""))),
  N(A("Audit des logs : relie au signal.",[["Horaire","Connexion à 3 h du matin"],["Volume","Accès massif à des dossiers"],["Lien","Dossier consulté sans rapport avec l'activité"]],""))
 ]},
 {id:"ds12c",t:"Image, assurance, crise",s:"Fiches 6 à 9 · e-réputation, responsabilité, crise, méthodes",items:[

 C:{id:"e3",n:"E3",t:"Épreuve blanche",
  P:{renaud:{n:"Mme Hélène Renaud",r:"Présidente du jury, diététicienne hospitalière",av:{bg:"#13303a",skin:"#f0c8a8",hair:"#9a9a9a",hs:"bun",shirt:"#ff9476",glasses:1}},

 stages:[
  {t:"1 · Bilan diététique et nutritionnel",ok:"Anamnèse, anthropométrie, clinique, biologie et contexte : votre bilan est complet.",mid:"Bilan correct, mais une dimension (contexte, évolution pondérale ou biologie) est incomplète.",ko:"Le bilan est la base : anamnèse, anthropométrie avec l'évolution du poids, clinique et biologie, contexte de vie."},

 items:[
  "1 · Bilan diététique et nutritionnel",

    ["Par le bilan : anamnèse, anthropométrie, clinique et biologie, contexte de vie",2,[0,0,0],"Étape 1 de la trame E3."],
    ["Par un menu type pour diabétique",0,[0,0,0],"On ne propose pas d'actions avant d'avoir compris la situation."],
    ["Par le diagnostic",1,[0,0,0],"Il vient juste après le bilan, qui en fournit les signes."]],

  BY("renaud",N([T(B_BILAN,"Conserves, dîner souvent sauté",0,""),T(B_BILAN,"61 kg, 68 kg il y a 6 mois",1,""),T(B_BILAN,"Albuminémie 33 g/L, HbA1c 8,4 %",2,""),T(B_BILAN,"Veuf, 2e étage sans ascenseur, petite retraite",3,"")])),
  BY("berger",C("Calculez la perte de poids de M. Dubois en 6 mois, en % (arrondi à l'entier).",10,"(68 − 61) / 68 × 100 ≈ 10,3 % : critère de dénutrition chez la personne âgée (≥ 10 % en 6 mois).","%",0.5)),
  BY("berger",C("Calculez son IMC (arrondi à l'entier).",21,"61 / 1,72² ≈ 20,6 kg/m² : inférieur à 22, seuil de la personne de 70 ans et plus.","kg/m²",0.5)),
  CH("berger","Que vous manque-t-il encore pour compléter le bilan ?",[
    ["Un rappel des 24 h ou un carnet alimentaire, l'appétit, la déglutition et l'état bucco-dentaire, ses capacités à faire les courses et cuisiner",2,[0,0,0],"On quantifie les apports et on évalue l'autonomie."],
    ["Rien, les chiffres suffisent",0,[0,0,0],"Sans évaluation des apports ni de l'autonomie, l'étiologie reste floue."],
    ["Uniquement une nouvelle HbA1c",1,[0,0,0],"Utile, mais le problème principal n'est pas que glycémique."]],
   "Bilan complet."),
  "2 · Diagnostic (PES)",
  CH("renaud","Quel est le problème prioritaire de M. Dubois ?",[
    ["Une dénutrition protéino-énergétique modérée",2,[0,0,0],"Perte ≥ 10 % en 6 mois, IMC < 22, albumine entre 30 et 35 g/L : c'est le problème prioritaire."],
    ["Un diabète mal équilibré",1,[0,0,0],"Réel (HbA1c 8,4 %), mais la dénutrition menace davantage : on ne restreint pas un patient âgé dénutri."],
    ["Une liste : diabète, dénutrition, isolement, budget",0,[0,0,0],"Le diagnostic PES pose UN problème prioritaire, pas une liste."]],
   "Méthode E3, étape 2."),
  BY("renaud",N([T(B_PES,"Dénutrition protéino-énergétique modérée",0,""),T(B_PES,"Apports insuffisants liés à l'isolement après le veuvage et à une alimentation de conserves",1,""),T(B_PES,"Perte de 10 % en 6 mois, IMC 20,6, albumine 33 g/L",2,"")])),
  BY("renaud",W("Rédigez le diagnostic diététique selon la structure PES.","Le patient présente une dénutrition protéino-énergétique modérée liée à des apports alimentaires insuffisants (perte d'appétit et isolement depuis son veuvage, alimentation de conserves, dîner sauté, difficultés à cuisiner), mise en évidence par une perte de poids de 10 % en 6 mois, un IMC à 20,6 kg/m² et une albuminémie à 33 g/L.",["Présente une dénutrition modérée","Liée à des apports insuffisants (isolement, conserves)","Mise en évidence par −10 % en 6 mois","IMC 20,6, albumine 33"])),
  CH("berger","Faut-il restreindre les glucides pour faire baisser l'HbA1c ?",[
    ["Non : chez ce patient âgé dénutri, la priorité est de couvrir les besoins ; on répartit les glucides sans restriction et on en parle au médecin",2,[0,0,0],"Le diagnostic prioritaire guide le plan."],
    ["Oui, un régime strict sans sucre",0,[0,0,0],"Une restriction aggraverait la dénutrition."]],
   "Cohérence diagnostic → plan."),
  "3 · Plan de soin",
  BY("renaud",N([T(B_OBJ3,"Restaurer un état nutritionnel satisfaisant",0,""),T(B_OBJ3,"Reprendre 2 kg d'ici 2 mois",1,""),T(B_OBJ3,"Enrichir les plats en protéines (œuf, fromage, poudre de lait)",2,""),T(B_OBJ3,"Prendre 3 repas et 1 collation par jour d'ici 1 mois",1,""),T(B_OBJ3,"Mettre en place le portage de repas",2,"")])),
  CH("dubois","« Vos histoires d'index glycémique, j'y comprends rien. Moi je mange mes boîtes. »",[
    ["« Votre corps, c'est un moteur : il lui faut du bon carburant. On choisit ensemble des boîtes et des plats simples à enrichir ? »",2,[0,0,0],"Langage adapté, métaphore, co-construction (cours 4)."],
    ["Je lui réexplique l'index glycémique plus lentement",0,[0,0,0],"Même mur d'incompréhension : résistance passive."],
    ["Je lui remets une brochure de la HAS",1,[0,0,0],"Sans adapter ni vérifier sa compréhension."]],
   "Éducation adaptée au patient."),
  CH("renaud","Quelles actions concrètes retenez-vous ?",[
    ["Alimentation enrichie et fractionnée, plats simples et conserves de meilleure qualité, portage de repas et aide aux courses avec l'assistante sociale, CNO si les apports restent insuffisants",2,[0,0,0],"Des actions reliées aux objectifs et au contexte."],
    ["Un plan alimentaire détaillé à cuisiner chaque jour",0,[0,0,0],"Irréaliste : il cuisine peu et n'a pas de mixeur."],
    ["Des CNO seuls, sans changer le reste",1,[0,0,0],"Possibles, mais l'alimentation enrichie vient d'abord."]],
   "Actions concrètes."),
  BY("berger",W("Comment vérifiez-vous que M. Dubois a compris le plan ?","Par le teach-back : je lui demande de me réexpliquer avec ses mots ce qu'il va manger demain et pourquoi, plutôt que « vous avez compris ? ». Je me limite à 2 ou 3 messages clés et je valorise ce qu'il sait déjà.",["Teach-back : il réexplique","2-3 messages clés","Valoriser ses savoirs"])),
  "4 · Suivi et évaluation",
  BY("renaud",O("Remettez dans l'ordre le suivi de M. Dubois.",["Pesée hebdomadaire au domicile","Consultation de suivi à 1 mois","Albuminémie de contrôle à 3 mois","Réajuster le plan si les objectifs ne sont pas atteints"],"")),
  CH("berger","Un mois plus tard, il a encore perdu 1 kg.",[
    ["Je retourne au bilan : apports réels, portage bien utilisé ? Je réajuste (CNO, enrichissement) et j'alerte le médecin traitant",2,[0,0,0],"La démarche est un cycle : retour au bilan."],
    ["Je maintiens le plan, il faut du temps",0,[0,0,0],"Une perte qui continue impose de réajuster."]],
   "Méthode E3, étape 4."),
  BY("renaud",A("Relie chaque indicateur à ce qu'il suit.",[["Poids","Évolution de l'état nutritionnel"],["Albuminémie","Statut protéique"],["Carnet alimentaire","Observance"],["Ressenti, appétit","Vécu du patient"]],"")),

 C:{id:"e5",n:"E5",t:"Épreuve blanche",

    ["D'ici juin 2028, 60 % des familles d'élèves des 3 écoles auront participé à au moins 2 ateliers cuisine, mesuré par les feuilles d'émargement",2,[0,0,0],"Spécifique, mesurable, atteignable, réaliste, daté."],

    ["Une conférence sur l'équilibre alimentaire",1,[0,0,0],"De l'information : utile, mais elle n'agit ni sur l'environnement ni sur le pouvoir d'agir."]],

  "4 · Mise en œuvre",

    ["Centre social, écoles et santé scolaire, PMI, mairie, marché, associations d'aide alimentaire, avec des conventions",2,[0,0,0],"Cartographie des acteurs et engagements formalisés."],
    ["Avec une enseigne de supermarché qui finance tout",0,[0,0,0],"Conflit d'intérêts possible : la neutralité est menacée."]],

var W=[0.4072,1.1829,3.1262,15.4722,7.2102,0.5316,1.0651,0.0234,1.616,0.1544,1.0824,1.9813,0.0953,0.2975,2.2042,0.2407,2.9466];
var DECAY=-0.5,FACTOR=19/81;
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function retr(t,s){return Math.pow(1+FACTOR*t/s,DECAY)}
function D0(g){return clamp(W[4]-(g-3)*W[5],1,10)}
function memOf(id){return S.mem[id]||null}
function R(id,at){var m=memOf(id);if(!m)return 0;var t=Math.max(0,((at||Date.now())-m.last)/DAY);return retr(t,m.s)}
function review(n,g){
  var m=memOf(n.id),now=Date.now();
  if(!m){m={d:D0(g),s:W[g-1],last:now,reps:1,lapses:g===1?1:0,tier:n.tiers[0],top:false};}
  else{var t=Math.max(0,(now-m.last)/DAY),r=retr(t,m.s);
    var d=m.d-W[6]*(g-3);d=W[7]*D0(3)+(1-W[7])*d;m.d=clamp(d,1,10);
    if(g===1){m.s=W[11]*Math.pow(m.d,-W[12])*(Math.pow(m.s+1,W[13])-1)*Math.exp(W[14]*(1-r));m.lapses++;}
    else{m.s=m.s*(Math.exp(W[8])*(11-m.d)*Math.pow(m.s,-W[9])*(Math.exp(W[10]*(1-r))-1)*(g===2?W[15]:1)*(g===4?W[16]:1)+1);}
    m.s=clamp(m.s,0.1,36500);m.last=now;m.reps++;}
  /* paliers */
  var i=n.tiers.indexOf(m.tier);if(i<0)i=0;var before=m.tier,isTop=i===n.tiers.length-1;
  if(g>=2){if(isTop){if(g>=3)m.top=true;}else m.tier=n.tiers[i+1];}
  else{m.tier=n.tiers[Math.max(0,i-1)];}
  S.mem[n.id]=m;
  var dk=today();S.days[dk]=(S.days[dk]||0)+1;
  save();
  return {from:before,to:m.tier,top:m.top};
}
function tierOf(n){var m=memOf(n.id);return m&&n.tiers.indexOf(m.tier)>=0?m.tier:n.tiers[0]}
var STATES=["Nouvelle","En apprentissage","Ancrée","Maîtrisée"];
function stateOf(n){var m=memOf(n.id);if(!m)return 0;if(m.top&&m.s>=21)return 3;
  if(m.s>=4&&(n.tiers.length===1||m.tier>n.tiers[0]))return 2;return 1;}
function examAt(w){var d=S.exams&&S.exams[w];if(!d)return null;var t=new Date(d+"T08:00:00").getTime();return isNaN(t)?null:t}
function isDue(n){var m=memOf(n.id);if(!m)return false;var r=R(n.id);if(r<0.9)return true;
  var ex=examAt(n.world),now=Date.now();if(ex&&ex>now&&ex-now<45*DAY&&(now-m.last)>DAY*0.9&&R(n.id,ex)<0.85)return true;return false}
function dueList(w){var a=[];Object.keys(NOTIONS).forEach(function(k){var n=NOTIONS[k];if((!w||n.world===w)&&isDue(n))a.push(n)});a.sort(function(x,y){return R(x.id)-R(y.id)});return a}
function avgR(list,at){if(!list.length)return 0;var s=0;list.forEach(function(n){s+=R(n.id,at)});return s/list.length}
function streak(){var n=0,d=new Date();if(!S.days[today()])d.setDate(d.getDate()-1);
  for(;;){var k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(S.days[k]){n++;d.setDate(d.getDate()-1);}else break;}return n}

/* --- normalisation des réponses tapées --- */
var SUB={"₀":"0","₁":"1","₂":"2","₃":"3","₄":"4","₅":"5","₆":"6","₇":"7","₈":"8","₉":"9","⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁺":"+","⁻":"-"};
function norm(s){s=String(s).toLowerCase().replace(/[₀-₉⁰¹²³⁴-⁹⁺⁻]/g,function(c){return SUB[c]||c}).replace(/œ/g,"oe").replace(/æ/g,"ae").replace(/[’`]/g,"'");
  s=s.normalize("NFD").replace(/[̀-ͯ]/g,"");
  s=s.replace(/^\s*(le|la|les|un|une|des|du|de la)\s+/,"").replace(/^\s*(l|d)'\s*/,"");
  return s.replace(/[^a-z0-9+]/g,"");}
function lev(a,b){if(a===b)return 0;var m=a.length,n=b.length,d=[];for(var i=0;i<=m;i++){d[i]=[i]}for(var j=1;j<=n;j++)d[0][j]=j;
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function matchAns(input,list){var x=norm(input);if(!x)return false;
  return list.some(function(a){var y=norm(a);if(x===y)return true;if(/\d/.test(y))return false;var tol=y.length>=9?2:y.length>=5?1:0;return tol&&lev(x,y)<=tol;});}
function blanks(t){var out=[],re=/\{([^}]*)\}/g,m;while((m=re.exec(t)))out.push(m[1].split("|"));return out}

var TIERN={1:"Reconnaître",2:"Rappeler",3:"Appliquer"};
var KIND={qcm:"QCM",calc:"Calcul",tri:"Tri",assoc:"Association",ordre:"Remise en ordre",saisie:"Réponse libre",trous:"Texte à trous",pourquoi:"Explique pourquoi",erreur:"Trouve l'erreur",schema:"Schéma à légender"};
function Session(list,isDefi){
  var i=0,res=[],ups=0,l=G.lvl,cur=null;

    setProg(list.length,i,res);if(list[i].ch){drawChoice(list[i].ch);return;}var n=list[i],tier=tierOf(n),forms=n.f[tier],f=pick(forms),st=stateOf(n);

    var ctx=f.ctx?'<div class="ctx">'+esc(f.ctx)+'</div>':'';

  function spkHtml(f,n){var sp=speaker(f,n);return sp?'<div class="spk">'+sp.av+'<div class="bub"><small>'+esc(sp.n)+'</small><span class="small mut">'+esc(sp.r)+'</span></div></div>':""}
  function drawChoice(f){cur={ch:f,done:false};var sp=speaker(f,null);
    var opts=shuffle(f.opts.map(function(o){return {o:o}}));
    var data="";if(f.data){var mx=Math.max.apply(null,f.data.rows.map(function(r){return r[1]}))*1.15;
      data='<div class="databox"><div class="lbl">'+esc(f.data.t)+'</div>'+f.data.rows.map(function(r){return '<div class="drow"><span>'+esc(r[0])+'</span><span class="db"><i style="width:'+(100*r[1]/mx)+'%"></i></span><b>'+fr(r[1])+' %</b></div>'}).join("")+'</div>';}
    $("#gStage").innerHTML='<div class="qcard pop"><div class="where">Mission · étape '+(i+1)+'/'+list.length+'</div><div class="tags"><span class="kind">Décision</span><span>Tes choix modifient les jauges</span></div>'+
      (sp?'<div class="spk">'+sp.av+'<div class="bub"><small>'+esc(sp.n)+'</small><h3>'+esc(f.q)+'</h3></div></div>':'<h3>'+esc(f.q)+'</h3>')+data+
      '<div class="opts">'+opts.map(function(x,j){return '<button class="opt" type="button" data-j="'+j+'">'+esc(x.o[0])+'</button>'}).join("")+'</div><div id="fb"></div></div>';
    $$(".opt").forEach(function(b){b.onclick=function(){if(cur.done)return;cur.done=true;var x=opts[+b.dataset.j],q=x.o[1],d=x.o[2]||[0,0,0];
      $$(".opt").forEach(function(y,j){y.disabled=true;if(opts[j].o[1]===2)y.classList.add("ok")});if(q<2)b.classList.add(q===1?"sel":"ko");
      b.insertAdjacentHTML("beforeend",'<span class="rx">'+esc(x.o[3])+'</span>');
      if(G.gauges){G.gauges=G.gauges.map(function(v,k){return clamp(v+d[k],0,100)});drawGauges(d);}
      res[i]=q===2;setProg(list.length,i,res);if(q===2)award(15);else if(q===1)award(5);
      var title=q===2?"Excellent choix ! +15 XP":q===1?"Choix acceptable, mais il y avait mieux. +5 XP":"Mauvais choix : la meilleure option est en vert.";
      feedback(q===2,title,f.e||"",G.course?G.course.n+". "+G.course.t:"Mission",i<list.length-1?"Suivant →":"Voir les conséquences",function(){i++;if(i<list.length){draw();window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});}else if(G.onEnd)G.onEnd(res);});
    }});
  }

  function confBar(f){if(f.k==="assoc"||f.k==="pourquoi")return "";

  var h='<div class="card" id="syncCard"><div class="lbl" style="margin-bottom:6px">Synchronisation entre appareils</div>';
  if(!SB_ON)return h+'<p class="small mut" style="margin:0">Pas encore activée. Une fois le jeu en ligne, remplis le fichier config.js avec ton adresse Supabase et ta clé publique : un bouton de connexion apparaîtra ici.</p></div>';
  if(SBuser){return h+'<p class="small" style="margin:0 0 8px">Connectée : <b>'+esc(SBuser.email||"")+'</b><br><span class="mut">'+(SBerr?"Erreur : "+esc(SBerr):SBlast?"Dernière synchro à "+SBlast.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"Synchronisation…")+'</span></p><div class="row"><button class="btn small teal" type="button" id="sbNow">Synchroniser maintenant</button><button class="btn small ghost" type="button" id="sbOut">Se déconnecter</button></div></div>';}
  if(SBstep===1)return h+'<p class="small" style="margin:0 0 8px">Un code a été envoyé à <b>'+esc(SBmail)+'</b>. Tape-le ici (regarde aussi les spams).</p><div class="row"><input id="sbCode" inputmode="numeric" autocomplete="one-time-code" placeholder="Code reçu" style="flex:1;min-height:44px;border-radius:12px;border:2px solid var(--line);padding:0 10px;font:inherit;background:var(--card);color:var(--ink)"><button class="btn small" type="button" id="sbVerify">Valider</button></div><button class="idk" type="button" id="sbBack">Changer d\'adresse</button>'+(SBerr?'<p class="small" style="color:var(--coralD);margin:6px 0 0">'+esc(SBerr)+'</p>':'')+'</div>';
  return h+'<p class="small mut" style="margin:0 0 8px">Connecte-toi avec ton e-mail pour retrouver ta progression sur ton téléphone et ton ordinateur. Tu recevras un code à 6 chiffres, sans mot de passe.</p><div class="row"><input id="sbMail" type="email" autocomplete="email" placeholder="ton@email.fr" value="'+esc(SBmail)+'" style="flex:1;min-width:180px;min-height:44px;border-radius:12px;border:2px solid var(--line);padding:0 10px;font:inherit;background:var(--card);color:var(--ink)"><button class="btn small" type="button" id="sbSend">Recevoir un code</button></div>'+(SBerr?'<p class="small" style="color:var(--coralD);margin:6px 0 0">'+esc(SBerr)+'</p>':'')+'</div>';}
function refreshSync(){var c=$("#syncCard");if(!c)return;c.outerHTML=syncCard();wireSync();}
function wireSync(){
  var s=$("#sbSend");if(s){var go=function(){var m=$("#sbMail").value.trim();if(!/.+@.+\..+/.test(m)){SBerr="Adresse e-mail invalide.";refreshSync();return;}SBmail=m;s.disabled=true;
    SB.auth.signInWithOtp({email:m,options:{shouldCreateUser:true}}).then(function(r){if(r.error){SBerr=r.error.message;}else{SBerr="";SBstep=1;}refreshSync();var c=$("#sbCode");if(c)c.focus();});};
    s.onclick=go;$("#sbMail").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();go();}});}
  var v=$("#sbVerify");if(v){var ver=function(){var t=$("#sbCode").value.replace(/\D/g,"");if(t.length<6){SBerr="Le code contient au moins 6 chiffres.";refreshSync();return;}v.disabled=true;
    SB.auth.verifyOtp({email:SBmail,token:t,type:"email"}).then(function(r){if(r.error){SBerr="Code incorrect ou expiré.";}else{SBerr="";SBstep=0;toast("Connectée ! Ta progression est synchronisée.");}refreshSync();});};
    v.onclick=ver;$("#sbCode").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();ver();}});}
  var b=$("#sbBack");if(b)b.onclick=function(){SBstep=0;SBerr="";refreshSync();};
  var n=$("#sbNow");if(n)n.onclick=function(){n.disabled=true;syncNow().then(function(){toast("Synchronisé.")});};
  var o=$("#sbOut");if(o)o.onclick=function(){push().then(function(){return SB.auth.signOut()}).then(function(){SBuser=null;refreshSync();});};
}
/* PWA : fonctionne hors ligne une fois installé */
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});}

/* =============== DÉMARRAGE =============== */
show("home");
})();

</script></body></html>
