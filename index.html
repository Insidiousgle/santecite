 mission:{id:"sp19m",t:"La maison de santé d'Annecy",items:[
  CH("fournier","Audit du cabinet : tout le monde travaille en administrateur, pas de verrouillage, disques non chiffrés. Ta priorité ?",[
    ["Acheter un nouvel ordinateur",0,[0,-2,-8],"Le matériel ne règle rien sans bonnes pratiques."],
    ["Comptes standard, verrouillage automatique, chiffrement BitLocker/FileVault, mises à jour hors consultation",2,[6,6,-2],"Sécuriser le poste, premier maillon."]],
   "Fiche 1."),
  BY("roussel",T(B_ATT,"Un e-mail « de l'ARS » me demande de confirmer mes identifiants via un lien",1,"Hameçonnage : ne jamais cliquer, vérifier par un autre canal.")),
  CH("caron","Pour échanger les comptes rendus entre nous, on utilise nos messageries personnelles.",[
    ["On continue, c'est simple",0,[0,-10,0],"Inadapté aux données de santé."],
    ["Migration vers MSSanté en 3 mois : formation, tests, bascule",2,[4,8,-2],"Chiffrement, identité vérifiée, traçabilité."]],
   "Fiche 4."),
  CH("fournier","Le logiciel de dossiers patients serait hébergé chez un prestataire. Que vérifies-tu ?",[
    ["Le prix",0,[0,-4,2],"Critère insuffisant."],
    ["Certification HDS sur le site de l'ANS, serveurs dans l'UE, SLA, sauvegardes, contrat art. 28",2,[4,8,-2],"Les 6 critères et le contrat de sous-traitance."]],
   "Fiche 3."),
  BY("roussel",C("Une patiente a demandé l'accès à son dossier le 3 mars. Au plus tard dans combien de mois dois-je répondre (hors demande complexe) ?",1,"Art. 12 RGPD : 1 mois.","mois")),
  CH("fournier","Lundi matin : les fichiers sont illisibles et un message demande une rançon.",[
    ["Payer la rançon pour récupérer vite les dossiers",0,[-4,-8,-10],"Aucune garantie, et cela finance les attaquants."],
    ["Confiner (isoler les postes), alerter l'équipe de crise, évaluer, puis éradiquer et restaurer depuis la sauvegarde 3-2-1",2,[6,6,-3],"Plan de réponse aux incidents."],
    ["Redémarrer les ordinateurs en espérant que ça passe",0,[-2,-4,0],"Risque d'aggraver la situation."]],
   "Fiche 9."),
  CH("caron","Des données patients ont pu être consultées par l'attaquant. Que faisons-nous ?",[
    ["Rien, tant que personne ne se plaint",0,[0,-14,0],"L'absence de notification aggrave la sanction."],
    ["Notifier la CNIL sous 72 h, informer les patients si le risque est élevé, inscrire au registre, communiquer de façon transparente",2,[4,10,-2],"Art. 33 et 34 RGPD."]],
   "Fiche 9."),
  BY("fournier",W("Rédige le plan de sécurité numérique de la maison de santé.","Poste : pare-feu, mises à jour hors consultation, comptes standard, antivirus pro, chiffrement. Accès : 12 caractères, double authentification, gestionnaire, verrouillage, journaux. Données : hébergeur HDS (UE, contrat art. 28), MSSanté, registre art. 30, information et droits sous 1 mois, archivage (20 ans, mineur 28 ans). Prévention : hygiène quotidienne, phishing simulé trimestriel, double contrôle. Incidents : plan testé (détecter → apprendre), sauvegardes 3-2-1 testées, notification CNIL 72 h, cyberassurance.",["Poste et accès","Hébergement, MSSanté, RGPD","Prévention, facteur humain","Plan d'incident, sauvegardes, notification"]))
 ]}
};

/* ---------- SOIN 1 · ORGANISATION DES STRUCTURES DE SOINS ---------- */
var B_STRUCT=[["CHU","plateau technique"],["Libéral","relation longue"],["EHPAD","histoire de vie"],["HAD","soins au domicile"]];
var B_FIN=[["ONDAM","enveloppe globale"],["T2A","selon l'activité"],["MIGAC","missions non marchandes"],["ARS","régulation régionale"]];
var B_EXTRA=[["HAD",""],["SSR / SMR",""],["Centre de jour",""],["Équipe mobile",""]];
COURS.ds1={id:"ds1",n:"Soin 1",t:"Organisation des structures de soins",lieu:"CHU de Nantes → Saint-Nazaire → EHPAD",
 pitch:"Mme Jeanne Delmart, 78 ans, diabétique sous insuline, dénutrie après un AVC, passe par trois diététiciennes : au CHU, en libéral, puis en EHPAD. L'efficacité dépend autant de l'expertise de chacune que de la façon dont les structures se passent le relais.",
 P:{martineau:{n:"Sophie Martineau",r:"Diététicienne · CHU de Nantes",av:{bg:"#ff9476",skin:"#f0c8a8",hair:"#2b1b14",hs:"bun",shirt:"#55d6cf"}},
    renard:{n:"Julia Renard",r:"Diététicienne libérale · Saint-Nazaire",av:{bg:"#5bb8f5",skin:"#e8b896",hair:"#c26a2e",hs:"long",shirt:"#ffc94a"}},
    lemoine:{n:"Martha Lemoine",r:"Diététicienne · EHPAD Les Jardins de l'Erdre",av:{bg:"#ae8dff",skin:"#c99067",hair:"#8a8a8a",hs:"short",shirt:"#ff7a59",glasses:1}}},
 conseil:{who:"martineau",t:"Pour chaque structure, pose-toi 4 questions : quel rythme, quelles ressources, quelles contraintes, quel rôle pour moi ? À l'hôpital, prioriser (É-P-P-D) ; à la sortie, ne jamais laisser de rupture (F-T-R-J : fiche, téléphone, RDV à 7-14 jours, justificatifs) ; pour la télémédecine, d'abord une plateforme sécurisée (P-C-S-C)."},
 levels:[
 {id:"ds1a",t:"L'hôpital",s:"Fiches 1 et 2 · organisation, SPH, GHT",items:[
  "Fiche 1 · Organisation, temps, ressources",
  N(Q("À l'hôpital, l'organisation dans laquelle travaille le diététicien est…",["Matricielle (pyramidale) : chef de service, équipe paramédicale, staffs, protocoles de la CME","Totalement libre : il choisit ses horaires et ses méthodes","Uniquement rattachée au chef de cuisine"],"Il garde sa spécificité d'expert tout en travaillant avec des métiers différents."),
    S("Quel sigle désigne la commission qui valide les protocoles à l'hôpital ?",["cme"],"Commission médicale d'établissement."),
    E(["À l'hôpital,"," le diététicien choisit librement ses horaires et la durée de ses consultations,"," tout en participant aux staffs."],1,"C'est une caractéristique du libéral. À l'hôpital : 15 minutes maximum par consultation et un rythme imposé.","Piège d'examen.")),
  N(A("Journée type de Sophie au CHU : relie.",[["Patients suivis","25 en même temps"],["Consultation","15 minutes maximum"],["Imprévus","Décompensations, syndrome de renutrition"],["Transmissions","Informatisées et obligatoires"]],""),
    F("Au CHU, Sophie suit {25} patients en même temps, en consultations de {15} minutes maximum.",""),
    W("Face à 25 patients et des urgences imprévues, comment Sophie doit-elle s'organiser ?","Elle priorise selon la gravité nutritionnelle (les urgences d'abord), s'organise et synthétise ; elle s'appuie sur les protocoles et transmet tout de façon informatisée.",["Prioriser selon la gravité","S'organiser","Synthétiser, transmettre"])),
  N(Q("Quelle ressource fait l'avantage de l'hôpital pour les situations aiguës ?",["Le plateau technique : laboratoire sur site, cuisine centrale, équipe complète, impédancemétrie","Le temps long de consultation","La liberté de tarification"],"Ex. : bilans rapides d'albumine, de préalbumine, de vitamines."),
    S("Comment appelle-t-on l'ensemble des moyens techniques de l'hôpital (labo, cuisine centrale, matériel) ?",["plateau technique","le plateau technique"],""),
    CAS("Mme Delmart arrive aux urgences après un AVC, avec des troubles de la déglutition.",Q("Pourquoi le CHU est-il le bon lieu à cette étape ?",["Bilans biologiques rapides, textures modifiées en cuisine centrale, orthophoniste et équipe sur place","Parce qu'elle y aura des consultations d'une heure","Parce que le CHU n'a pas de contrainte budgétaire"],""))),
  N(Q("Quel est l'effet de la T2A sur la prise en charge diététique ?",["Elle réduit mécaniquement la durée de séjour, donc le temps de prise en charge","Elle allonge les séjours","Elle supprime les prescriptions de CNO"],"La prescription de CNO doit aussi être précisément justifiée."),
    S("Quel sigle désigne la tarification à l'activité ?",["t2a"],""),
    W("Pourquoi le diététicien hospitalier doit-il justifier chaque prescription ?","Sous T2A et pression de rentabilité, la prescription de CNO exige une justification médicale précise : il doit optimiser le rapport coût/efficacité.",["T2A, rentabilité","Justification médicale des CNO","Rapport coût/efficacité"])),
  "Fiche 2 · Service public hospitalier et GHT",
  N(Q("Qu'est-ce qui distingue le service public hospitalier (SPH) des cliniques privées ?",["Il soigne tout le monde, tout le temps, sans but lucratif","Il choisit ses patients","Il ne fait que des soins curatifs"],"Il regroupe CHU, CH, hôpitaux locaux et les ESPIC (anciens PSPH)."),
    F("Le SPH est défini par l'article {L6112-1|L. 6112-1|L 6112-1} du Code de la santé publique.",""),
    E(["Les missions du SPH : accueillir tous les patients 24 h/24,"," dégager des bénéfices pour l'établissement,"," former et faire de la recherche."],1,"L'objectif lucratif n'est jamais une mission du SPH : les excédents sont réinvestis.","Piège d'examen.")),
  N(O("Remets dans l'ordre les 4 principes du SPH (mnémo É-C-A-N).",["Égalité d'accès","Continuité des soins","Adaptabilité","Neutralité"],""),
    S("Quel mnémo résume les 4 principes du SPH ?",["ecan","e-c-a-n","é-c-a-n"],"Égalité, Continuité, Adaptabilité, Neutralité."),
    CAS("Un patient sans couverture sociale se présente de nuit au CH.",Q("Quel principe oblige à le prendre en charge ?",["L'égalité d'accès, avec la continuité des soins 24 h/24","La neutralité","L'adaptabilité"],""))),
  N([T(B_FIN,"Enveloppe budgétaire nationale votée chaque année",0,""),T(B_FIN,"Ressources selon l'activité médicale réalisée",1,""),T(B_FIN,"Financement des missions non marchandes",2,""),T(B_FIN,"Régulation par l'État en région",3,"")],
    S("Que signifie ONDAM ?",["objectif national des depenses d assurance maladie","objectif national des dépenses d'assurance maladie"],"")),
  N(Q("Un GHT (groupement hospitalier de territoire)…",["Mutualise informatique, achats, formation, qualité autour d'un projet médical partagé ; chaque établissement garde son autonomie juridique","Fusionne tous les hôpitaux en un seul établissement","Regroupe des cliniques privées"],"Un établissement support (souvent le CHU) gère les fonctions mutualisées."),
    F("Les GHT ont été créés par la loi de modernisation du système de santé de {2016}.",""),
    E(["Depuis son entrée dans un GHT,"," l'hôpital local a perdu son autonomie juridique"," et partage ses achats avec le CHU."],1,"Le GHT ne supprime pas l'autonomie juridique : chaque établissement travaille en réseau.","Piège d'examen."))
 ]},
 {id:"ds1b",t:"Libéral et médico-social",s:"Fiches 3 à 5 · libéral, EHPAD, hors hôpital",items:[
  "Fiche 3 · Le libéral",
  N(Q("Ce que permet le libéral, selon Julia :",["Une heure complète par patient : écoute approfondie, relation durable, dimensions psychosociales, suivi sur plusieurs mois","Des bilans biologiques immédiats","Une équipe pluridisciplinaire sur place"],"La qualité relationnelle plutôt que l'efficacité rapide."),
    F("En libéral, Julia consacre {1} heure à chaque patient, contre {15} minutes à l'hôpital.",""),
    W("Pourquoi Julia peut-elle explorer ce que Sophie n'a pas pu voir à l'hôpital ?","Avec une heure par patient et un suivi longitudinal sur plusieurs mois, elle dispose d'un temps d'écoute approfondie : elle peut explorer les dimensions psychosociales de l'alimentation et construire une relation durable.",["Une heure par patient","Suivi sur plusieurs mois","Dimensions psychosociales"])),
  N(O("Remets dans l'ordre les 4 dimensions de l'autonomie du libéral.",["Organisation du planning","Choix des méthodes thérapeutiques","Gestion directe de la relation avec le patient","Responsabilité économique complète"],""),
    A("Libéral : relie chaque contrainte à son contenu.",[["Gestion administrative","Comptabilité, déclarations, assurances"],["Patientèle","Prospection et fidélisation"],["Isolement","Réseau et formation continue indispensables"]],""),
    E(["En libéral, j'ai une autonomie totale"," et aucune responsabilité économique :"," c'est la grande différence avec l'hôpital."],1,"Il assume toute la responsabilité économique : tarification, gestion, développement.","Piège d'examen.")),
  N(O("Remets dans l'ordre les 5 défis de la coordination ville-hôpital.",["Compte-rendu d'hospitalisation en retard ou incomplet","Adapter les recommandations au domicile","Liaison avec le médecin traitant","Communication avec les autres paramédicaux","Articulation avec les services sociaux"],""),
    S("Quel est le premier défi de Julia quand Mme Delmart sort du CHU ?",["compte rendu en retard","compte-rendu en retard","compte rendu incomplet","compte-rendu d'hospitalisation en retard","compte rendu d hospitalisation en retard"],"Il arrive tard et parle peu de nutrition."),
    CAS("Mme Delmart rentre chez elle : petite cuisine, pas de mixeur, son fils passe une fois par semaine.",Q("Quel défi de la coordination ville-hôpital Julia rencontre-t-elle ?",["Adapter les recommandations aux réalités du domicile (équipement, habitudes, entourage)","Le compte-rendu en retard","L'articulation avec la CME"],""))),
  "Fiche 4 · L'EHPAD",
  N(Q("En EHPAD, le rôle de Martha dépasse la nutrition médicale : il s'agit de…",["Respecter l'histoire de vie, gérer les troubles cognitifs, rassurer les familles, maintenir le plaisir de manger","Appliquer strictement les régimes sans tenir compte des goûts","Faire des consultations de 15 minutes"],"L'approche est médico-sociale, globale."),
    S("Quelle dimension du repas Martha veut-elle préserver malgré les contraintes médicales ?",["plaisir alimentaire","le plaisir alimentaire","plaisir","plaisir de manger","dimension hedonique"],""),
    W("Pourquoi l'approche en EHPAD est-elle « globale » ?","Le résident y vit : il faut tenir compte de ses habitudes, de son histoire de vie, de sa culture, de ses troubles cognitifs et de sa famille, pas seulement de sa pathologie ; le plaisir de manger reste une priorité.",["Lieu de vie","Histoire de vie, culture","Plaisir, famille, cognition"])),
  N(A("EHPAD : relie chaque contrainte réglementaire.",[["HACCP","Plan de nettoyage, traçabilité, formation"],["Régimes","Traçabilité informatisée et horodatée"],["Évaluation externe","Tous les 5 ans"],["Référentiels","HAS du secteur médico-social"]],""),
    F("En EHPAD, l'évaluation externe a lieu tous les {5} ans ; la certification HAS des établissements de santé, tous les {4} ans.",""),
    E(["L'EHPAD est évalué tous les 4 ans,"," et la traçabilité des régimes y est obligatoire"," avec horodatage."],0,"Évaluation externe EHPAD : tous les 5 ans. 4 ans = certification HAS.","Piège d'examen.")),
  N(O("Remets dans l'ordre l'adaptation de la prise en charge en EHPAD.",["Construire le plan selon habitudes et capacités cognitives","Impliquer famille et équipe dès la prescription de textures modifiées","Respecter l'HACCP et documenter chaque changement","Former le personnel à la dénutrition et à l'aide au repas"],"")),
  "Fiche 5 · Hors de l'hôpital",
  N([T(B_EXTRA,"Soins techniques complexes au domicile",0,""),T(B_EXTRA,"Transition entre soins aigus et retour à l'autonomie",1,""),T(B_EXTRA,"Prise en charge partielle, le patient garde son domicile",2,""),T(B_EXTRA,"Intervient en établissement ou à domicile",3,"")],
    F("Les SSR sont devenus les {SMR} (soins médicaux et de réadaptation) en {2023}.",""),
    E(["Une nutrition entérale par pompe à domicile, avec soins techniques,"," relève du diététicien libéral"," en lien avec le prestataire."],1,"Les soins techniques au domicile, c'est l'HAD, pas le libéral.","Piège d'examen.")),
  N(A("Prestataires de santé à domicile : relie.",[["Matériel","Pompes de nutrition entérale, CNO"],["Formation","Patients et aidants"],["Coordination","Avec les professionnels de santé"]],""),
    Q("Que font les PTA depuis 2022 ?",["Elles ont fusionné dans les DAC (dispositifs d'appui à la coordination)","Elles ont été remplacées par les GHT","Elles gèrent les urgences vitales"],"Elles coordonnent les parcours complexes.")),
  N(A("Structures innovantes : relie.",[["MSP","Médecins et paramédicaux autour d'un projet de santé"],["Centre de soins non programmés","Urgences non vitales"],["DAC (ex-PTA)","Coordination des parcours complexes"],["Télémédecine","Suivi à distance des patients chroniques"]],""),
    S("Que signifie MSP ?",["maison de sante pluriprofessionnelle","maison de santé pluriprofessionnelle","maisons de sante pluriprofessionnelles"],""))
 ]},
 {id:"ds1c",t:"Coordonner",s:"Fiches 6 à 8 · parcours, évolutions, méthodes",items:[
  "Fiche 6 · Parcours de soins et coordination",
  N(Q("La permanence des soins, c'est…",["Garantir la continuité et l'égalité d'accès aux soins urgents en dehors des heures habituelles, 24 h/24 et 7 j/7","Garder le même diététicien toute sa vie","Un parcours de soins coordonné"],"C'est une obligation de service public."),
    S("Comment appelle-t-on l'enchaînement coordonné d'actes et de professionnels autour du patient ?",["parcours de soins","le parcours de soins","parcours de soin"],"")),
  N(O("Remets dans l'ordre les 4 casquettes du diététicien pivot.",["Interface entre équipe médicale et paramédicale","Référent nutritionnel des décisions complexes","Coordinateur des aspects nutritionnels du parcours","Expert conseil selon l'évolution clinique"],""),
    A("Relie chaque outil de coordination à sa fonction.",[["DMI","Partager poids, bilans, prescriptions"],["Fiche de liaison","Synthèse pour le transfert"],["Réunion pluridisciplinaire","Discuter les cas complexes"],["Téléphone","Ajustements urgents"],["Télémédecine","Suivi à distance"]],""),
    E(["Parmi les outils de coordination,"," seul le DMI est vraiment efficace ;"," les réunions et le téléphone sont secondaires."],1,"Piège : les 4 (DMI, fiches de liaison, réunions, téléphone) facilitent la coordination.","Piège d'examen.")),
  N(A("Réseaux territoriaux : relie.",[["Réseau gérontologique","EHPAD, gériatrie, services à domicile"],["Associations de patients diabétiques","Éducation thérapeutique, pairs"],["Pharmaciens","CNO, éducation"],["Services sociaux","Adaptation des aides"]],""),
    W("Pourquoi la coordination conditionne-t-elle l'efficacité thérapeutique ?","Les outils et réseaux assurent la traçabilité, évitent les pertes d'information entre structures et gardent la cohérence thérapeutique : la meilleure expertise est perdue si l'information ne suit pas le patient.",["Traçabilité","Pas de perte d'information","Cohérence thérapeutique"])),
  "Fiche 7 · Évolutions du système",
  N(A("Chiffres des évolutions : relie.",[["Durée moyenne de séjour","−20 % en 10 ans"],["HAD","+15 % par an"],["Plus de 85 ans","×2 d'ici 2050"],["Certification HAS","Tous les 4 ans"]],""),
    F("La durée moyenne de séjour a baissé de {20} % en 10 ans ; l'HAD progresse de {15} % par an.",""),
    W("Quelles compétences le virage ambulatoire impose-t-il au diététicien ?","Moins d'hospitalisation complète, plus de libéral, d'HAD et de structures intermédiaires : il faut savoir coordonner les parcours, utiliser la télémédecine et rendre le patient autonome.",["Coordination de parcours","Télémédecine","Autonomisation du patient"])),
  N(O("Remets dans l'ordre les 5 nouvelles fonctions du diététicien.",["Coordinateur de parcours","Référent nutrition institutionnel","Expert en nutrition clinique","Consultant en santé publique","Diététicien en télémédecine"],""),
    Q("Les démarches qualité imposent…",["Certification HAS tous les 4 ans, EPP, indicateurs de qualité nutritionnelle, audits externes","Une évaluation tous les 10 ans","Uniquement une auto-évaluation"],"Une culture de l'évaluation permanente."),
    CAS("Le nombre de plus de 85 ans va doubler d'ici 2050.",Q("Quel besoin en découle pour la diététique ?",["Diététique gériatrique massive : dénutrition, déglutition, polypathologies, prévention de la dépendance","Moins de besoins car les seniors mangent moins","Uniquement plus de lits d'hôpital"],""))),
  "Fiche 8 · Méthodes",
  N(O("Prioriser à l'hôpital (É-P-P-D) : remets dans l'ordre.",["Évaluer rapidement la gravité nutritionnelle","Prioriser selon la sévérité","S'appuyer sur les protocoles","Déléguer, coordonner, noter dans le DMI"],""),
    S("Quel mnémo résume la priorisation à l'hôpital ?",["eppd","e-p-p-d","é-p-p-d"],"")),
  N(O("Continuité hôpital → domicile (F-T-R-J) : remets dans l'ordre.",["Fiche de liaison standardisée","Téléphoner au libéral ou au médecin traitant","RDV de suivi planifié avant la sortie","Justificatifs et protocoles des compléments"],""),
    F("Le RDV de suivi se planifie avant la sortie, dans les {7} à {14} jours.",""),
    CAS("Mme Delmart sort du CHU vendredi. Sophie n'a rempli que le DMI.",W("Que manque-t-il pour éviter une rupture de soins ?","La méthode F-T-R-J : une fiche de liaison standardisée, un appel à Julia ou au médecin traitant, un RDV de suivi planifié dans les 7 à 14 jours avant la sortie, et les justificatifs et protocoles des compléments.",["Fiche de liaison","Appel","RDV à 7-14 jours","Justificatifs"]))),
  N(Q("Pour intégrer la télémédecine (P-C-S-C), quelle est la 1re étape ?",["Une plateforme sécurisée et conforme aux données de santé","Former le patient","Structurer les séances"],"Puis consentement et formation, séances structurées, bilans en présentiel si besoin."),
    O("Coordonner en territoire rural : remets dans l'ordre.",["Cartographier les ressources locales","Mobiliser réseaux gérontologiques et partenaires","Déployer télémédecine et prestataires","Fiches de liaison simples, contacts centralisés"],""),
    CAS("M. Martin vit seul dans la Creuse, à 60 km de l'hôpital, sans diététicien à proximité.",W("Cite 3 obstacles et 3 ressources mobilisables.","Obstacles : distance et isolement, peu de professionnels, transmissions difficiles. Ressources : IDE libérale et pharmacie locale, réseau gérontologique ou DAC, téléconsultation et prestataire à domicile, avec une fiche de liaison simple et un contact centralisé.",["Distance, isolement, peu de pros","IDE, pharmacie, réseau, DAC","Téléconsultation, prestataire"]))),
  N([T(B_STRUCT,"Bilans rapides, contrainte T2A et rythme",0,""),T(B_STRUCT,"Relation longue, contrainte de gestion et d'isolement",1,""),T(B_STRUCT,"Plaisir alimentaire, contrainte HACCP et traçabilité",2,""),T(B_STRUCT,"Soins techniques, coordination avec les prestataires",3,"")])
 ]}
 ],
 mission:{id:"ds1m",t:"Le parcours de Mme Delmart",items:[
  CH("martineau","Lundi, CHU : 25 patients, dont Mme Delmart (AVC, fausses routes, glycémies instables) et 3 patients stables. Par où commencer ?",[
    ["Mme Delmart : évaluation rapide de la gravité, protocole dysphagie, orthophoniste prévenue, tout dans le DMI",2,[10,4,8],"É-P-P-D : la sévérité d'abord."],
    ["Les patients stables d'abord, ils sont plus rapides",0,[-12,0,-6],"Le risque de fausse route et de déséquilibre glycémique passe avant."],
    ["Je fais tout moi-même sans déléguer",1,[2,0,-4],"Impossible à tenir : déléguer et coordonner fait partie de la méthode."]],
   "Fiche 8 · É-P-P-D."),
  BY("martineau",T(B_FIN,"Le séjour de Mme Delmart est raccourci : l'établissement est payé selon l'activité",1,"La T2A réduit la durée de séjour.")),
  CH("martineau","Mme Delmart sort vendredi. Que prépares-tu ?",[
    ["Fiche de liaison, appel à Julia, RDV dans 10 jours, justificatifs des CNO",2,[8,6,10],"F-T-R-J : aucune rupture."],
    ["Le compte-rendu partira avec le courrier habituel",0,[-8,-4,-10],"Le compte-rendu arrive souvent en retard et parle peu de nutrition."],
    ["Je note tout dans le DMI, ça suffit",1,[0,0,-2],"Le DMI hospitalier n'est pas forcément accessible en ville."]],
   "Fiche 8 · F-T-R-J."),
  CH("renard","Première consultation à Saint-Nazaire. Mme Delmart : « Mixer mes repas ? Je n'ai même pas de mixeur, et je mange seule. »",[

    W("Face à M. Mansouri, comment Valérie articule-t-elle éthique et déontologie ?","D'abord la réflexion éthique pour comprendre les enjeux moraux (conviction, santé, autonomie), puis les règles déontologiques : informer des risques et respecter le choix final. Cette articulation protège contre l'arbitraire.",["Éthique d'abord : comprendre","Déontologie : informer, respecter","Contre l'arbitraire"])),
  N(O("Remets dans l'ordre les 3 piliers de la responsabilité.",["Obligation de moyens","Reconnaissance de ses limites","Adaptation à chaque patient"],""),
    Q("Le diététicien a une obligation…",["De moyens : tout mettre en œuvre selon les connaissances, sans garantir le résultat","De résultat : le patient doit perdre du poids","De moyens et de résultat"],""),
    E(["Si mon patient ne maigrit pas,"," j'ai manqué à mon obligation de résultat"," envers lui."],1,"Le diététicien a une obligation de moyens, pas de résultat.","Piège d'examen.")),
  N(CAS("Une patiente décrit des palpitations et des malaises répétés pendant la consultation.",Q("Que fait Valérie ?",["Elle l'oriente vers le médecin : c'est un acte responsable, pas un aveu d'échec","Elle adapte seule son régime pour corriger les malaises","Elle attend la prochaine consultation"],"Reconnaître ses limites protège le patient."))),
  "Fiche 2 · Le secret : ce que dit la loi",
  N(F("Le secret professionnel relève de l'article {226-13} du Code pénal : tout ce qui est « dit, vu, entendu ou compris ».",""),
    F("Violer le secret : {1} an d'emprisonnement et {15000|15 000} € d'amende.",""),
    E(["Le secret couvre ce que le patient me dit"," mais pas ce que j'observe"," ni mon attitude non verbale."],1,"Il couvre tout : dit, vu, entendu ou compris, quels que soient le canal et l'attitude.","")),
  N(Q("L'article 226-14 du Code pénal permet de lever le secret…",["En cas de danger grave et immédiat pour la vie ou l'intégrité d'une personne","Dès qu'un proche le demande","Si l'employeur le demande"],"Autres exceptions : maltraitances, maladies déclarables, témoignage judiciaire."),
    A("Relie chaque exception légale au secret.",[["226-14","Danger grave et immédiat"],["Signalement","Maltraitances"],["Santé publique","Maladies infectieuses déclarables"],["Justice","Témoignage sur commission"]],""),
    W("Pourquoi chaque levée du secret demande-t-elle une réflexion éthique ?","Le secret n'est pas absolu, mais il fonde la relation de confiance : il faut peser le devoir de confidentialité et le devoir de protection avant toute révélation.",["Secret non absolu","Confidentialité contre protection","Confiance"])),
  N(O("Remets dans l'ordre les 3 conditions cumulatives du secret partagé.",["Information strictement nécessaire aux soins","Professionnels directement impliqués","Patient informé et non opposé"],""),
    E(["Grâce au secret partagé,"," je transmets tout le dossier à toute l'équipe du service,"," puisque le patient est informé."],1,"Seulement le strict nécessaire, aux seuls professionnels impliqués.","Piège d'examen.")),
  N(Q("La discrétion professionnelle interdit de parler de ses patients…",["Dans les lieux publics, sur les réseaux sociaux et même en famille","Seulement sur les réseaux sociaux","Seulement aux journalistes"],"Ces règles engagent la responsabilité pénale, professionnelle et éthique."))
 ]},
 {id:"ds3b",t:"Mansouri, Dutoit, Kevin",s:"Fiches 3 à 5 · autonomie, confidentialité, mineur",items:[
  "Fiche 3 · M. Mansouri : autonomie et consentement",
  N(Q("Le principe d'autonomie signifie…",["Le patient peut décider, même contre l'avis du diététicien ; la décision doit être éclairée","Le diététicien décide pour le bien du patient","Le patient doit suivre les recommandations"],"C'est la pierre angulaire de l'éthique médicale."),
    CAS("M. Mansouri : « Pendant le Ramadan, je dois jeûner. C'est plus important que ma santé. »",W("Quelle posture adopte Valérie ?","Elle reconnaît l'importance du Ramadan, explore les adaptations possibles, contacte l'imam (avec son accord) pour connaître les aménagements autorisés et explique clairement les risques (hypoglycémies, décompensation). C'est une compétence culturelle, sans devenir expert en théologie.",["Reconnaître la conviction","Explorer les adaptations, l'imam","Expliquer les risques"]))),
  N(O("Remets dans l'ordre les 6 étapes du consentement éclairé.",["Expliquer les risques simplement","Présenter les alternatives","Vérifier la compréhension","Respecter le temps de réflexion","Documenter l'information","Accepter la décision finale"],""),
    S("Comment s'appelle la technique où le patient réexplique ce qu'il a compris ?",["teach back","teach-back","le teach-back"],""),
    E(["Pour vérifier qu'il a compris,"," je lui demande « Vous avez bien compris ? »,"," et il dit oui."],1,"Le teach-back : le patient réexplique avec ses mots, ce qui révèle les incompréhensions.","")),
  N(Q("M. Mansouri maintient son jeûne. Respecter son refus, c'est…",["Accepter sans juger et continuer l'accompagnement dans les limites acceptées, en documentant","Arrêter le suivi puisqu'il refuse","Le signaler à son médecin pour qu'il le convainque"],""),
    E(["M. Mansouri refuse mes conseils :"," par respect pour son choix, j'arrête le suivi"," et je le documente."],1,"Respecter un refus ne veut pas dire arrêter : on continue dans les limites acceptées.","Piège d'examen."),
    W("Quel protocole Valérie met-elle en place pendant le jeûne ?","Des appels réguliers, une surveillance glycémique renforcée et des critères d'interruption en cas de décompensation : elle respecte l'autonomie tout en maintenant la sécurité.",["Appels réguliers","Glycémies renforcées","Critères d'interruption"])),
  "Fiche 4 · Mme Dutoit : la confidentialité",
  N(CAS("Mme Dutoit : « Rien ne doit sortir, même pas dans mon dossier. »",Q("Valérie peut-elle promettre « rien dans le dossier » ?",["Non : elle doit documenter, mais en protégeant l'information (dossier séparé, codage, accès limité)","Oui, si la patiente le demande","Oui, pour une boulimie"],"Piège d'examen.")),
    A("Le protocole de Valérie pour Mme Dutoit : relie.",[["Dossier","Séparé pour les informations sensibles"],["Codage","Spécifique"],["Accès","Seuls les professionnels impliqués"],["Droits","L'employeur ne peut pas accéder au dossier"]],"")),
  N(Q("Le « cercle minimum » du secret partagé pour Mme Dutoit :",["Médecin traitant et psychologue, chacun ne reçoit que ce qui relève de sa compétence","Toute l'équipe du service","Son employeur et la médecine du travail"],""),
    O("Respecter le secret au quotidien : remets dans l'ordre.",["Ne jamais confirmer la présence d'un patient","Éviter ascenseurs, cafétérias, transports","Sécuriser les échanges électroniques","Prudence absolue sur les réseaux sociaux","Propos mesurés hors temps de travail"],""),
    CAS("Le frère de Mme Dutoit appelle : « Ma sœur est bien suivie chez vous ? »",Q("Que répond-on ?",["On ne confirme ni n'infirme sa présence sans son accord explicite","On confirme, c'est un proche","On donne la date du prochain RDV"],""))),
  "Fiche 5 · Kevin : la minorité",
  N(Q("Comment Valérie organise-t-elle le suivi de Kevin, 16 ans ?",["Séances alternées : en famille pour l'adhésion des parents, seul pour son expression libre","Uniquement avec les parents, qui ont l'autorité","Uniquement avec Kevin, sans les parents"],"Autorité parentale et autonomie émergente."),
    A("Intérêt supérieur du mineur : relie chaque dimension à évaluer.",[["Psychologique","Impact des restrictions"],["Alimentaire","Risque de TCA"],["Familiale","Équilibre familial"]],""),
    W("Pourquoi l'intérêt supérieur de Kevin peut-il primer sur ses parents ?","Il guide toutes les décisions en cas de conflit : si la stratégie restrictive des parents menace sa santé (impact psychologique, risque de troubles alimentaires), il prime sur leurs demandes, jusqu'au signalement si nécessaire, tout en respectant leur légitimité et leurs inquiétudes.",["Guide en cas de conflit","Restrictions, TCA","Signalement possible"])),
  N(Q("L'obligation de signalement s'active…",["En cas de suspicion de maltraitance grave ; elle protège l'enfant et le professionnel","Dès que les parents sont en désaccord","Jamais pour un diététicien"],""),
    E(["Valérie repère des signes de dépression chez Kevin :"," elle l'oriente vers un psychologue"," et arrête son suivi diététique."],2,"Orienter ne veut pas dire arrêter : elle oriente vers le psychologue et le médecin traitant et continue son suivi.","Piège d'examen."))
 ]},
 {id:"ds3c",t:"Responsabilités et outils",s:"Fiches 6 à 9 · périmètre, AFDN, outils éthiques, méthodes",items:[

    S("Cite un acte exclu du périmètre du diététicien.",["prescription medicamenteuse","prescription médicamenteuse","diagnostic medical","diagnostic médical","prescrire un medicament"],"")),

    Q("Les 3 responsabilités sont…",["Cumulables : une même faute peut engager les trois","Exclusives : une seule à la fois","Réservées aux médecins"],""),

  N(Q("Le code de déontologie du diététicien…",["A été élaboré par l'AFDN : référence reconnue, sans valeur légale stricte","Est inscrit dans le Code de la santé publique","N'existe pas"],"Contrairement aux médecins ou infirmiers."),
    A("Les 4 principes du code AFDN : relie.",[["Objectivité","Information fondée et impartiale"],["Promotion de la santé","Au cœur de l'action"],["Développement professionnel","Faire progresser la profession"],["Collaboration","Pluridisciplinaire"]],""),

    A("Faire évoluer sa pratique éthique : relie.",[["Analyse de pratiques","Présenter ses dilemmes aux pairs"],["Culture d'établissement","Former, formaliser des protocoles"],["Veille réglementaire","Par thèmes : droits, secret, responsabilité, évolutions sociales"]],""),
    W("Pourquoi la réflexion éthique ne se fait-elle pas seul ?","La mutualisation des expériences (groupes de pairs, revues de pratiques, accompagnement institutionnel, formation) améliore la qualité des prises en charge ; les protocoles harmonisent les décisions récurrentes et la veille permet d'anticiper les changements.",["Mutualiser les expériences","Protocoles, harmonisation","Anticiper par la veille"])),
  "Fiche 8 · Rose des vents et triangle",
  N([T(B_ROSE,"Réflexion philosophique : valeurs, sens de l'action",0,""),T(B_ROSE,"Contexte relationnel : soignants, soignés, proches",0,""),T(B_ROSE,"Vécu personnel : émotions, histoire de vie",0,""),T(B_ROSE,"Règles juridiques, déontologiques, institutionnelles",1,""),T(B_ROSE,"Connaissances scientifiques",1,""),T(B_ROSE,"Enjeux socio-culturels et économiques",1,"")],
    C("Combien de thématiques compte la rose des vents de l'éthique ?",6,"3 individuelles et 3 collectives.")),
  N(A("Triangle de l'éthique : relie chaque pôle.",[["Je","Vivre une vie bonne"],["Tu","Avec et pour autrui"],["Il","Dans des institutions justes"]],""),
    S("Que place-t-on au centre du triangle de l'éthique ?",["le soin","soin","la relation a l autre","relation à l'autre"],""),
    A("Les 3 facteurs à prendre en compte : relie.",[["Patient","Autodétermination"],["Clinique","Adéquation avec le bénéfice attendu"],["Sens","Valeurs et symboles du soin"]],"")),

  N(O("Patient qui refuse pour raisons religieuses : remets dans l'ordre.",["Écouter sans jugement","Expliquer risques et alternatives, teach-back","Proposer un suivi adapté et documenté","Consulter des ressources culturelles avec accord"],""),
    W("Quel est le réflexe commun à toutes les situations éthiques ?","Documenter : faits, informations fournies, compréhension du patient, décisions, orientations hors périmètre, preuves du consentement et du suivi, en limitant les détails sensibles dans le dossier général.",["Faits, informations, décisions","Consentement et suivi","Protéger les détails sensibles"]),
    CAS("Les parents de Kevin exigent de connaître tout ce qu'il dit en séance individuelle.",Q("Que fait Valérie ?",["Elle explique aux parents les limites de la confidentialité, évalue l'intérêt de Kevin et documente","Elle leur répète tout, ils ont l'autorité parentale","Elle arrête les séances individuelles"],"")))
 ]}

 mission:{id:"ds3m",t:"Une semaine de dilemmes",items:[
  CH("mansouri","« Docteur, je jeûnerai pendant le Ramadan, quoi que vous disiez. »",[
    ["« Je respecte votre choix. Parlons des risques et de ce qu'on peut adapter ensemble. Vous pouvez me réexpliquer ? »",2,[6,12,8],"Autonomie, information, teach-back."],
    ["« C'est dangereux, je vous l'interdis. »",0,[-4,-14,-6],"Le patient décide ; le rôle est d'éclairer sa décision."],
    ["« D'accord, faites comme vous voulez. »",1,[-8,2,-6],"Respect sans information : la décision n'est pas éclairée."]],
   "Fiche 3."),
  BY("chassagne",O("Remets dans l'ordre le consentement de M. Mansouri.",["Expliquer les risques","Présenter les alternatives","Vérifier la compréhension","Laisser le temps","Documenter","Accepter la décision"],"")),
  CH("chassagne","Le jeûne commence. Comment le suivre ?",[
    ["Appels réguliers, glycémies renforcées, critères d'interruption clairs, le tout documenté",2,[12,8,8],"Autonomie et sécurité."],
    ["J'arrête le suivi jusqu'à la fin du Ramadan",0,[-12,-6,-8],"Respecter un refus ne veut pas dire arrêter."]],
   "Fiche 3."),
  CH("dutoit","« Mon DRH m'a croisée dans le couloir. Il va appeler pour savoir si je suis suivie ici. »",[
    ["Personne ne confirmera votre présence ; votre employeur n'a pas accès à votre dossier, qui est protégé",2,[4,12,8],"Ne jamais confirmer une présence ; droits de la patiente."],
    ["Je lui conseille de dire la vérité à son DRH",0,[0,-12,-2],"Ce n'est pas le rôle du diététicien, et cela trahit sa demande."],
    ["Je lui promets de ne rien écrire dans son dossier",0,[-2,4,-12],"Impossible : on documente en protégeant l'information."]],
   "Fiche 4."),
  BY("chassagne",T(B_RESP,"Un collègue raconte le cas de Mme Dutoit à la cafétéria : il commet une infraction",1,"Violation du secret : responsabilité pénale (art. 226-13).")),
  CH("chassagne","Les parents de Kevin : « Mettez-le à 1 200 kcal, il doit apprendre la discipline. » Kevin se ferme.",[
    ["Séances alternées : famille pour l'adhésion, Kevin seul pour s'exprimer ; j'évalue le risque de TCA et je respecte leurs inquiétudes",2,[10,12,8],"Autorité parentale, autonomie émergente, intérêt supérieur."],
    ["J'applique la demande des parents, ils ont l'autorité",0,[-10,-12,-6],"L'intérêt supérieur de l'enfant prime sur une stratégie qui menace sa santé."],
    ["Je ne vois plus que Kevin, sans les parents",1,[2,-4,-2],"Il faut aussi l'adhésion parentale."]],
   "Fiche 5."),
  BY("chassagne",W("Analyse le cas de Kevin avec le triangle de l'éthique.","Je : ce que Valérie juge bon pour vivre une vie bonne (sa conscience professionnelle). Tu : Kevin et ses parents, avec et pour qui elle agit (relation, autonomie émergente, inquiétudes des parents). Il : les institutions justes (autorité parentale, intérêt supérieur de l'enfant, signalement si besoin). Le soin est au centre ; on cherche l'équilibre des trois pôles.",["Je : vie bonne","Tu : avec et pour Kevin et sa famille","Il : règles et institutions","Soin au centre, équilibre"]))
 ]}
};

COURS.ds4={id:"ds4",n:"Soin 4",t:"Communication ciblée en soin nutritionnel",lieu:"Service de nutrition clinique · CHU de Toulouse",
 pitch:"Céline Laroche l'a appris avec les années : chaque patient a besoin d'un langage différent. M. Dubois, ancien ajusteur, décroche dès qu'on parle d'index glycémique ; le Dr Benali, urgentiste, veut des références ; Léa, 17 ans, ne veut plus rien entendre. Bien communiquer, ce n'est pas simplifier pour tous, c'est ajuster à chacun.",
 P:{laroche:{n:"Céline Laroche",r:"Diététicienne · CHU de Toulouse",av:{bg:"#ff9476",skin:"#f0c8a8",hair:"#c26a2e",hs:"bun",shirt:"#13303a"}},
    dubois:{n:"Georges Dubois",r:"Patient, 78 ans, diabétique",av:{bg:"#ffc94a",skin:"#e8b896",hair:"#d9d9d9",hs:"short",shirt:"#5bb8f5"}},

 conseil:{who:"laroche",t:"Adapter, puis vérifier la compréhension. Faible littératie : mots familiers, métaphores, 2 ou 3 messages, faire reformuler. Patient expert : reconnaître son expertise, références, co-construire. Adolescent en souffrance : valider l'émotion, ne pas juger ni ordonner. Barrière de langue : interprète professionnel. Support écrit : public cible, 2-3 points, tester."},
 levels:[
 {id:"ds4a",t:"Ajuster son langage",s:"Fiches 1 à 3 · M. Dubois, Dr Benali, Léa",items:[
  "Fiche 1 · M. Dubois : l'adaptation socioculturelle",
  N(Q("M. Dubois acquiesce poliment mais ne change rien. C'est…",["Une résistance passive, signe d'une communication inadaptée","Un manque de volonté","Une bonne compréhension"],"Index glycémique et équivalences glucidiques ont créé un mur d'incompréhension."),
    S("Comment appelle-t-on le fait d'acquiescer sans rien changer ?",["resistance passive","résistance passive","la resistance passive"],"")),
  N(A("Ce que Céline dit à M. Dubois : relie.",[["Glycémie","Sucre dans le sang"],["Index glycémique","Rapidité d'absorption des sucres"],["Explication technique","Le corps, un moteur qui a besoin du bon carburant"]],""),
    O("Remets dans l'ordre les 5 techniques d'adaptation du langage.",["Identifier l'univers de référence","Remplacer les termes techniques","Utiliser des métaphores concrètes","Se référer à ses savoirs","Valoriser ses connaissances"],""),
    E(["Adapter mon langage à M. Dubois,"," c'est appauvrir mon expertise"," pour me mettre à son niveau."],1,"C'est une sophistication de la transmission, pas un appauvrissement de l'expertise.","Piège d'examen.")),
  N(A("L'alliance thérapeutique repose sur : relie.",[["Respect","Le patient dans sa singularité"],["Savoirs","Valoriser son expérience"],["Objectifs","Co-construits"],["Rythme","Adapté à ses capacités d'assimilation"]],""),
    W("Pourquoi Céline dit-elle « Votre grand-mère avait raison : les légumes du jardin sont meilleurs que les conserves » ?","Elle fait un décodage culturel : M. Dubois vient d'une génération où les savoirs se transmettaient par l'expérience. En valorisant ses connaissances, elle crée l'alliance : il se sent compris et respecté, donc il accepte les recommandations.",["Décodage culturel","Valoriser ses savoirs","Compris, respecté : il adhère"])),
  "Fiche 2 · Le Dr Benali : le patient expert",
  N(Q("Avec le Dr Benali, urgentiste, une pédagogie simplifiée serait…",["Infantilisante : elle attend une discussion scientifique argumentée","Idéale pour la rassurer","Obligatoire pour tous les patients"],"Il faut évaluer tôt le niveau d'expertise et les attentes."),
    O("Remets dans l'ordre les conseils avec un patient expert.",["Reconnaître son expertise","Discussion scientifique argumentée","Références actualisées","Co-construire les objectifs","Garder son expertise diététique"],""),
    E(["Le Dr Benali connaît la physiopathologie mieux que moi :"," je la laisse décider seule de son alimentation"," et je m'efface."],1,"Reconnaître son expertise ne veut pas dire abandonner la sienne : on garde son expertise nutritionnelle et on co-construit.","Piège d'examen.")),
  N(S("La posture évolue de « sachante » à…",["facilitatrice experte","facilitatrice","facilitateur expert"],"Face à des patients de plus en plus informés."),
    W("Qu'exige un patient expert de la part du diététicien ?","Une mise à jour scientifique rigoureuse (dernières publications, débats actuels) et la capacité à justifier ses choix thérapeutiques, avec des références.",["Mise à jour scientifique","Justifier ses choix","Références"])),
  "Fiche 3 · Léa : l'adolescent en souffrance",
  N(A("Les 3 barrières chez Léa : relie.",[["Autorité","Méfiance envers les adultes"],["Identité","Quête identitaire de l'adolescence"],["Souffrance","Souffrance psychique de l'anorexie"]],""),
    Q("Pourquoi les conseils classiques échouent-ils avec Léa ?",["Ils sont vécus comme des injonctions et créent des résistances actives","Elle ne sait pas lire","Ils sont trop courts"],"")),
  N(O("Remets dans l'ordre les 6 techniques de communication non-violente.",["Valider les émotions","Éviter interprétations et jugements","Reformulation empathique","Respecter les silences","Créer un cadre sécurisant","Impliquer l'adolescent dans les objectifs"],""),
    S("Quelle technique consiste à redire l'émotion entendue pour ouvrir le dialogue ?",["reformulation empathique","la reformulation empathique"],""),
    CAS("Léa : « Vous comprenez rien ! Vous êtes payée pour être là, moi je subis ! »",Q("Quelle réponse ?",["« Je sens beaucoup de colère, et j'entends que tu te sens incomprise. Tu peux m'aider à comprendre ? »","« Je suis là pour ton bien, il faut manger. »","« Si tu continues, on va devoir t'hospitaliser. »"],"On valide l'émotion avant tout."))),
  N(E(["Léa se tait depuis deux minutes :"," je comble le silence en lui expliquant"," les risques de la dénutrition."],1,"Il faut respecter les silences et ne pas argumenter : on valide d'abord l'émotion.","Piège d'examen."),
    W("Pourquoi Céline travaille-t-elle avec un psychologue pour Léa ?","La communication avec un adolescent en souffrance demande des compétences en psychologie : le rôle du diététicien s'articule avec un accompagnement psychologique global, parfois avec une formation complémentaire.",["Compétences en psychologie","Accompagnement global","Collaboration étroite"]))
 ]},

 mission:{id:"ds4m",t:"Une journée, trois langages",items:[
  CH("dubois","« Votre index glycémique, j'y comprends rien. Moi je mange mes boîtes, c'est tout. »",[
    ["« Votre corps, c'est un moteur : certains sucres brûlent d'un coup, d'autres tiennent la route. On regarde vos boîtes ensemble ? »",2,[6,12,6],"Univers de référence, métaphore, co-construction."],
    ["Je lui réexplique l'index glycémique plus lentement",0,[0,-8,-2],"Même mur d'incompréhension : la résistance passive continue."],
    ["Je lui donne la brochure du service",1,[0,-2,-2],"Sans adapter ni vérifier la compréhension."]],
   "Fiche 1."),
  BY("laroche",O("Remets dans l'ordre ce que fait Céline avec M. Dubois.",["Identifier son univers d'ancien ajusteur","Remplacer « glycémie » par « sucre dans le sang »","La métaphore du moteur","Valoriser ce qu'il sait du jardin"],"")),
  CH("benali","« Expliquez-moi pourquoi 55 % de glucides plutôt que 45 %. Et donnez-moi les recommandations HAS. »",[
    ["Je reconnais son expertise, j'argumente avec les références actuelles et on co-construit ses objectifs",2,[4,12,8],"Discussion scientifique argumentée."],
    ["« Ne vous inquiétez pas, faites-moi confiance. »",0,[0,-12,-4],"Argument d'autorité infantilisant pour une patiente experte."],
    ["« Vous êtes médecin, décidez vous-même. »",0,[-4,-4,-6],"Le diététicien garde son expertise nutritionnelle."]],
   "Fiche 2."),
  CH("laroche","Léa croise les bras et ne dit plus rien depuis le début de la séance.",[
    ["Je respecte son silence, puis : « Tu as l'air en colère d'être ici. Tu veux m'en parler ? »",2,[4,14,4],"Respect des silences, validation de l'émotion."],
    ["Je lui rappelle que son poids est dangereux et qu'elle doit manger",0,[-4,-14,-4],"Vécu comme une injonction : résistance active."]],
   "Fiche 3."),
  BY("laroche",T(B_TRANS,"« Mme Arnaud mange mieux en début de repas : servir le plat protidique en premier. »",2,"Une adaptation concrète du repas, pour l'aide-soignant.")),
  BY("laroche",W("Rédige la trame du compte-rendu de M. Dubois pour l'équipe.","Situation : 78 ans, diabétique, vit seul, mange surtout des conserves. Analyse : faible littératie en santé, résistance passive aux explications techniques. Recommandations : 2-3 messages simples, conserves moins salées et légumes, suivi régulier. Actions : médecin (adapter le traitement), IDE (surveiller glycémies et compréhension), AS (adaptations des repas). Daté, signé, confidentiel.",["Situation","Analyse","Recommandations","Actions par intervenant","Daté, signé"]))
 ]}

    E(["Le délai de prise en charge d'une dénutrition"," est un indicateur de résultats"," de la qualité en EHPAD."],1,"Les délais d'intervention sont un indicateur de processus ; les fausses routes, un résultat.","Piège d'examen.")),

    W("Pourquoi mesurer la qualité en nutrition est-il complexe ?","Les résultats sont souvent multifactoriels et à long terme : le poids se mesure facilement, mais l'état général, la satisfaction ou le bien-être alimentaire demandent des indicateurs variés (structure, processus, résultats).",["Multifactoriel","Long terme","Indicateurs variés"])),

  "Fiche 5 · Tableau de bord et harmonisation",

    F("Un tableau de bord efficace compte {5} à {8} indicateurs, suivis chaque {mois}.","")),

    Q("La « flexibilité contrôlée » des protocoles, c'est…",["Standardiser les éléments clés en gardant l'adaptation locale et au patient","Tout uniformiser","Laisser chacun faire comme il veut"],""),
    E(["Harmoniser les pratiques du réseau,"," c'est appliquer exactement le même plan"," à tous les patients."],1,"Harmoniser n'est pas uniformiser : on garde l'adaptation au contexte et au patient.","Piège d'examen.")),
  N(O("Formation qui accompagne les protocoles : remets dans l'ordre.",["Sessions de présentation","Ateliers pratiques","Audits ciblés de l'appropriation"],""),
    Q("Dans le réseau, Thierry, Marie-Claire et Vicente deviennent…",["Tour à tour formateurs et apprenants","Les contrôleurs des autres","Des cas d'école à éviter"],"Le réseau devient un laboratoire d'amélioration continue.")),
  "Fiche 6 · Méthodes",
  N(A("Relie chaque situation au réflexe.",[["Audit","Critères, période représentative, références, bienveillance"],["Événement indésirable","Faits, causes sans coupable, actions, soutien"],["Indicateurs","3 catégories, 5 à 8, seuils d'alerte"],["Équipe hétérogène","Confiance, non-jugement, participation"]],""),
    W("Quel est le fil commun de toute la démarche d'amélioration ?","Objectiver (critères, données, indicateurs), sans juger (bienveillance, analyse systémique), puis améliorer ensemble (protocoles, formation, partage en réseau).",["Objectiver","Sans juger","Améliorer ensemble"]))
 ]}
 ],
 mission:{id:"ds7m",t:"Un an de qualité en Bretagne",items:[
  CH("lebrun","« 60 % contre 78 % ? Impossible, mes patients sont ravis de moi. »",[
    ["« Ces chiffres ne te jugent pas : cherchons ensemble les causes, formation, outils de suivi, et construisons un plan. »",2,[6,12,10],"Audit bienveillant : le choc devient motivation."],
    ["« Les chiffres sont là, il va falloir te remettre en question sérieusement. »",0,[0,-12,-2],"Démarche vécue comme une sanction : résistance."],
    ["« Bon, laissons tomber l'audit. »",0,[-6,2,-12],"L'illusion de compétence continue."]],
   "Fiches 0 et 1."),
  BY("bertrand",O("Remets le cycle d'audit de Thierry dans l'ordre.",["Critère : taux d'objectifs glycémiques atteints","6 mois de données","Comparaison aux 78 % du réseau","Écarts : formation, outils","Plan d'amélioration"],"")),
  CH("jouan","« Mon patient est en réanimation à cause de moi. Je devrais arrêter. »",[
    ["Je l'écoute, puis on décrit les faits sans chercher de coupable, avant d'analyser les causes ensemble",2,[4,14,10],"Soutien émotionnel et analyse structurée."],
    ["« Effectivement, c'est une grave erreur. »",0,[0,-14,-4],"Culpabiliser bloque l'analyse."],
    ["« Ce n'est rien, oublie. »",0,[-6,2,-12],"Sans analyse, l'erreur risque de se reproduire."]],
   "Fiche 3."),
  BY("bertrand",T(B_FACT,"Aucun document de référence sur le potassium pour les patients dialysés",1,"Absence de protocole standardisé.")),
  CH("bertrand","Vicente veut suivre 25 indicateurs chaque semaine dans son EHPAD.",[
    ["On garde 5 à 8 indicateurs (structure, processus, résultats), avec des seuils d'alerte et un suivi mensuel partagé",2,[4,6,12],"Un tableau de bord lisible et utile."],
    ["Parfait, plus on mesure, mieux c'est",0,[0,-2,-10],"Trop d'indicateurs : personne ne les suit."]],
   "Fiche 5."),
  BY("bertrand",W("Quelles actions préventives pour Marie-Claire ?","Formation en néphrologie nutritionnelle ; protocole standardisé pour les insuffisants rénaux (liste d'aliments riches en potassium, conseils précis) ; meilleure communication avec l'équipe médicale sur l'évolution de la fonction rénale ; partage des enseignements avec le réseau pour éviter la récurrence.",["Formation","Protocole","Communication","Partage au réseau"]))
 ]}
};

COURS.ds8={id:"ds8",n:"Soin 8",t:"Cadre réglementaire du numérique en santé",lieu:"Cabinet de diététique connecté · Bordeaux",
 pitch:"90 % des Français ont déjà utilisé un service numérique de santé, et la CNIL n'a jamais autant sanctionné. Claire Vasseur ouvre la téléconsultation dans son cabinet, avec Karim Haddad, consultant en protection des données. Base légale, hébergement HDS, droits des patients, violations : le numérique étend tes responsabilités, pas seulement tes outils.",
 P:{vasseur:{n:"Claire Vasseur",r:"Diététicienne libérale · Bordeaux",av:{bg:"#5bb8f5",skin:"#f0c8a8",hair:"#2b1b14",hs:"long",shirt:"#ff9476"}},
    haddad:{n:"Karim Haddad",r:"Consultant en protection des données",av:{bg:"#13303a",skin:"#c99067",hair:"#1f1410",hs:"short",shirt:"#55d6cf",glasses:1}},
    leroy:{n:"Monique Leroy",r:"Patiente, 61 ans",av:{bg:"#ffc94a",skin:"#e8b896",hair:"#d9d9d9",hs:"bun",shirt:"#ae8dff"}}},
 conseil:{who:"haddad",t:"Vérifier, sécuriser, documenter. Base « soins » (art. 9.2.h) pour le suivi, mais information toujours obligatoire. Dès qu'un tiers héberge : certification HDS, en Europe. Règle 3-2-1 et restaurations testées chaque trimestre. Droit d'accès : accusé de réception sous 48 h, réponse sous 1 mois. Violation : CNIL sous 72 h."},
 levels:[
 {id:"ds8a",t:"Traiter les données",s:"Fiches 0 à 3 · données de santé, principes, information, AIPD",items:[
  "Fiche 0 · Le constat",
  N(A("Chiffres de départ : relie.",[["90 %","Français ayant utilisé un service numérique de santé"],["168","Mises en demeure de la CNIL en 2023"],["42","Sanctions de la CNIL en 2023"],["1/3","Des sanctions liées à la sécurité des données"]],""),
    A("Sigles du numérique en santé : relie.",[["RGPD","Règlement général sur la protection des données"],["HDS","Hébergement des données de santé"],["CNIL","Contrôle et sanctionne"],["AIPD","Analyse d'impact"],["COFRAC","Accrédite les certificateurs"]],"")),
  "Fiche 1 · Données de santé et bases légales",
  N(Q("Un journal alimentaire est-il une donnée de santé ?",["Oui : il peut révéler des troubles ou des pathologies","Non, ce n'est que de l'alimentation","Seulement s'il contient un poids"],"Définition à l'article 4 du RGPD."),
    S("Quel article du RGPD définit les données de santé ?",["4","article 4","art 4","l article 4"],""),
    W("Pourquoi les données diététiques sont-elles sensibles ?","Habitudes alimentaires, mesures, pathologies, traitements, biologie, objectifs nutritionnels révèlent l'état de santé : elles sont protégées contre les risques de discrimination et d'atteinte à la vie privée.",["Révèlent l'état de santé","Discrimination","Vie privée"])),
  N([T(B_BASE,"Bilan et suivi diététique",0,""),T(B_BASE,"Newsletter du cabinet",1,""),T(B_BASE,"Étude de recherche",1,""),T(B_BASE,"Conseils de suivi spécifique",0,""),T(B_BASE,"Application non thérapeutique",1,"")],
    F("La base légale « soins de santé » est l'article {9.2.h|9-2-h|9 2 h} du RGPD.",""),
    E(["Pour suivre Mme Leroy en consultation,"," je dois recueillir son consentement écrit"," au traitement de ses données."],1,"Base « soins » : pas de consentement nécessaire, mais l'information reste obligatoire.","Piège d'examen.")),
  N(Q("Consulter un dossier patient, c'est…",["Déjà un traitement de données","Neutre tant qu'on ne modifie rien","Interdit sans consentement"],"Collecte, stockage, consultation, modification, transmission, suppression.")),
  "Fiche 2 · Les 6 principes et la conservation",
  N(O("Remets dans l'ordre les 6 principes du responsable de traitement.",["Licéité","Loyauté","Transparence","Minimisation","Exactitude","Limitation de conservation"],""),
    E(["Selon le principe de minimisation,"," je collecte le plus d'informations possible"," au cas où elles serviraient."],1,"Minimisation = seulement les données strictement nécessaires à l'objectif thérapeutique.","Piège d'examen.")),
  N(F("Dossiers patients : {20} ans après la dernière consultation, dont {5} ans en base active ; données comptables : {10} ans.",""),
    O("Organiser la conservation : remets dans l'ordre.",["Registre des durées","Alertes de destruction","Révision annuelle des archives","Documenter chaque destruction"],""),
    CAS("Claire range ses dossiers papier, mais oublie ses e-mails et les sauvegardes de son application.",Q("Quel est le problème ?",["Les données numériques dispersées sont aussi soumises aux durées de conservation","Aucun, seuls les dossiers comptent","Les e-mails se suppriment seuls"],""))),
  "Fiche 3 · Information, consentement, AIPD",
  N(A("Information ou consentement : relie.",[["Information","Toujours obligatoire"],["Consentement","Seulement pour certains traitements"],["AIPD","Avant un traitement à risque élevé"]],""),
    O("Le consentement doit être : remets dans l'ordre.",["Libre","Spécifique","Éclairé","Univoque"],"Et retirable aussi facilement qu'il a été donné."),
    W("Que contient l'information du patient ?","Identité du responsable, finalités, base légale, destinataires, durées de conservation et droits du patient (accès, rectification, portabilité), documentée dans le dossier.",["Identité, finalités","Base légale, destinataires","Durées, droits"])),
  N(A("Quand faire une AIPD ? Relie.",[["Intelligence artificielle","Analyse automatique des repas"],["Croisement de données","Appli + objets connectés + dossier"],["Surveillance automatisée","Alertes automatiques sur le poids"]],""),
    O("AIPD d'une application nutritionnelle : remets dans l'ordre.",["Cartographier données, flux, finalités","Réduire les risques (pseudonymisation, minimisation)","Documenter, consulter la CNIL si risque élevé","Suivre après déploiement"],""))
 ]},
 {id:"ds8b",t:"Héberger et sécuriser",s:"Fiches 4 et 5 · HDS, sécurité, sauvegardes",items:[
  "Fiche 4 · L'hébergement des données de santé",
  N([T(B_HDS,"Logiciel de dossier patient dans le cloud",0,""),T(B_HDS,"Plateforme de téléconsultation",0,""),T(B_HDS,"Sauvegarde distante chez un prestataire",0,""),T(B_HDS,"Serveur personnel dans mon cabinet",1,"")],
    F("L'HDS est défini par l'article {L.1111-8|L1111-8|L 1111-8} du Code de la santé publique.",""),
    E(["Mon prestataire se dit « conforme RGPD » :"," il peut donc héberger mes dossiers patients"," sans autre vérification."],1,"« Conforme RGPD » ne veut pas dire « certifié HDS » : on vérifie la certification.","Piège d'examen.")),
  N(O("Remets dans l'ordre la procédure de certification HDS.",["Dossier auprès d'un organisme accrédité (COFRAC)","Audit documentaire et audit sur site","Certificat de 3 ans, audit de surveillance annuel"],""),
    F("En cas de non-conformité, l'hébergeur a {3} mois pour corriger ; le certificat vaut {3} ans.",""),
    A("Sanctions pour un hébergeur non certifié (L1115-1) : relie.",[["Personne physique","3 ans de prison, 45 000 €"],["Personne morale","Jusqu'à 225 000 €"]],"")),
  "Fiche 5 · Critères HDS et sécurité",
  N(O("Remets dans l'ordre les 4 critères de certification HDS.",["Localisation dans l'Union européenne","Sécurité physique","Sécurité logique","Continuité d'activité"],""),
    E(["Cet hébergeur américain est très sécurisé :"," il peut être certifié HDS"," pour mes données."],1,"Un hébergeur hors Union européenne ne peut pas être certifié HDS.","Piège d'examen.")),
  N(A("Mesures de sécurité : relie.",[["Chiffrement","AES-256, RSA-2048 minimum"],["Authentification","Multi-facteurs (MFA)"],["Accès","Besoin d'en connaître"],["Journalisation","Conservée au moins 1 an"]],""),
    Q("Où ranger les clés de chiffrement ?",["Jamais avec les données chiffrées : la gestion des clés est souvent le point faible","Dans le même dossier, pour les retrouver","Sur une clé USB attachée à l'ordinateur"],"")),
  N(F("Règle de sauvegarde {3}-{2}-{1} : 3 copies, 2 supports différents, 1 site distant certifié.",""),
    S("À quelle fréquence tester la restauration des sauvegardes ?",["chaque trimestre","tous les trimestres","trimestrielle","trimestriel","tous les 3 mois"],"Une sauvegarde non testée est potentiellement inutile."),
    CAS("Claire sauvegarde tout sur un disque dur posé à côté de son ordinateur.",W("Pourquoi n'est-ce pas suffisant ?","Une seule copie, un seul support, au même endroit : un vol, un incendie ou une panne détruisent tout. La règle 3-2-1 impose 3 copies sur 2 supports dont 1 sur un site distant certifié, chiffrées, avec des restaurations testées chaque trimestre.",["Une copie, même lieu","3-2-1","Chiffrer, tester"])))
 ]},
 {id:"ds8c",t:"Patients et incidents",s:"Fiches 6 à 8 · droits, violations, méthodes",items:[
  "Fiche 6 · Les droits des patients",
  N([T(B_DROIT,"Obtenir une copie de son dossier",0,""),T(B_DROIT,"Corriger un poids mal saisi",1,""),T(B_DROIT,"Récupérer ses données au format CSV ou HL7 FHIR",2,""),T(B_DROIT,"Demander la suppression de son dossier",3,"")],
    F("Droit d'accès : accusé de réception sous {48} h, réponse sous {1} mois (+{2} si complexe).",""),
    O("Traiter une demande d'accès : remets dans l'ordre.",["Accuser réception","Vérifier l'identité","Rassembler toutes les données","Répondre en langage clair","Documenter la demande"],"")),
  N(Q("Mme Leroy conteste une observation clinique de Claire.",["On privilégie le dialogue et on propose d'ajouter un commentaire de la patiente","On efface l'observation","On refuse toute discussion"],"On corrige ce qui est inexact, avec traçabilité."),
    E(["Mme Leroy change de diététicienne et me demande d'effacer son dossier :"," je le supprime immédiatement,"," c'est son droit."],1,"Le droit à l'effacement est très limité en santé : la conservation de 20 ans prime.","Piège d'examen.")),
  "Fiche 7 · Violations et assurance",
  N(Q("Une violation de données, c'est…",["Destruction, perte, altération, divulgation ou accès non autorisé à des données personnelles","Uniquement un piratage","Une erreur de facturation"],"Article 4 du RGPD."),
    O("Violation de données : remets dans l'ordre.",["Détecter tôt","Confiner l'incident","Documenter les actions","Notifier la CNIL","Informer les patients si risque élevé"],""),
    F("On notifie la CNIL sous {72} heures.","")),
  N(A("Principales causes de violation : relie.",[["E-mail","Mal adressé"],["Mot de passe","Trop faible"],["Clé USB","Perdue, non chiffrée"]],""),
    E(["Après une fuite de données,"," j'informe directement tous mes patients dans tous les cas,"," puis la CNIL."],1,"On notifie la CNIL sous 72 h ; on informe directement les patients seulement si le risque est élevé.","Piège d'examen."),
    W("Pourquoi négocier une extension de son assurance ?","Le numérique étend la responsabilité : il faut couvrir les frais de notification, la reconstruction des données, les pertes d'exploitation et la défense juridique. Les sanctions RGPD (jusqu'à 4 % du CA) et HDS ne sont généralement pas couvertes par les assurances classiques.",["Responsabilité étendue","Notification, reconstruction, défense","Sanctions non couvertes"])),
  "Fiche 8 · Méthodes",
  N(A("Relie chaque situation au réflexe.",[["Téléconsultation","Base soins, HDS, chiffrement, MFA"],["Prestataire cloud","Certificat, périmètre, SLA, contrat"],["Sauvegardes","3-2-1, tests trimestriels, clés séparées"],["Demande d'accès","48 h, 1 mois, traçabilité"]],""),
    S("Quel est le fil commun des méthodes ? (trois verbes)",["verifier securiser documenter","vérifier, sécuriser, documenter","verifier, securiser, documenter"],""))
 ]}
 ],
 mission:{id:"ds8m",t:"Le cabinet connecté de Claire",items:[
  CH("vasseur","Je choisis ma plateforme de téléconsultation. Celle-ci est gratuite et « conforme RGPD », hébergée aux États-Unis.",[
    ["Je vérifie la certification HDS (en cours de validité), le périmètre, la localisation en Europe, le contrat",2,[4,6,12],"Un hébergeur hors UE ne peut pas être certifié HDS."],
    ["Gratuit et conforme RGPD, ça me suffit",0,[-4,-6,-14],"Risque pénal et fuite possible."]],
   "Fiches 4, 5 et 8."),
  CH("leroy","« Vous m'avez fait signer un consentement pour mes données ? Je n'ai rien signé. »",[
    ["« Pour votre suivi, la base légale est les soins : pas besoin de consentement, mais voici l'information sur vos données et vos droits. »",2,[2,10,8],"Base « soins » et information obligatoire."],
    ["« Il faut absolument signer, sinon je ne peux pas vous suivre. »",0,[-4,-8,-4],"Le consentement n'est pas la base légale du suivi."]],
   "Fiches 1 et 3."),
  BY("haddad",T(B_BASE,"Claire veut envoyer une newsletter mensuelle à ses patients",1,"Usage non thérapeutique : consentement explicite.")),
  CH("vasseur","Lundi matin : j'ai perdu ma clé USB non chiffrée avec 300 dossiers patients.",[
    ["Je confine, je documente, je notifie la CNIL sous 72 h et j'informe les patients car le risque est élevé",2,[4,6,12],"Réaction rapide et documentée."],
    ["Je ne dis rien, elle sera peut-être retrouvée",0,[-6,-14,-14],"Manquement grave : notification obligatoire."]],
   "Fiche 7."),
  BY("haddad",O("Remets dans l'ordre la réponse à la demande d'accès de Mme Leroy.",["Accusé de réception sous 48 h","Vérifier son identité","Rassembler données, notes, factures","Répondre clairement sous 1 mois","Documenter"],"")),
  BY("haddad",W("Pourquoi Claire doit-elle faire une AIPD avant de lancer son appli d'analyse des repas par photo ?","C'est un traitement à risque élevé (intelligence artificielle, croisement de données de santé). L'AIPD cartographie données et flux, évalue les risques, définit des mesures (pseudonymisation, minimisation, sécurité), se documente, impose de consulter la CNIL si le risque résiduel reste élevé, et prévoit un suivi après lancement.",["IA, croisements : risque élevé","Cartographier, réduire","CNIL si risque résiduel","Suivi"]))
 ]}
};
